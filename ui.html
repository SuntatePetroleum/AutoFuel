<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>Fuel Scheduler</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #14181f; --muted: #5b6472; --faint: #8a93a0;
    --border: #e1e5ea; --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fff0e8; --accent-text: #b33a08;
    --danger: #c92a2a; --danger-soft: #fdecec; --ok: #2b8a3e; --ok-soft: #e9f6ec; --warn: #a15c00; --warn-soft: #fff4e0;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1115; --surface: #161a20; --surface-2: #1d222a; --text: #e7eaee; --muted: #a0a9b4; --faint: #77808c;
      --border: #272d36; --accent: #ff7a33; --accent-ink: #1a0b02; --accent-soft: #2a1a10; --accent-text: #ff9a5c;
      --danger: #ff6b6b; --danger-soft: #2c1517; --ok: #5ccf7a; --ok-soft: #12261a; --warn: #f0b04a; --warn-soft: #2a2010;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
  a { color: var(--accent-text); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; }

  header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; color: var(--text); min-width: 0; }
  .brand svg { flex: none; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  nav.tabs { max-width: 1000px; margin: 0 auto; display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { flex: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14px; }
  nav.tabs a:hover { background: var(--surface-2); color: var(--text); }
  nav.tabs a.on { background: var(--accent-soft); color: var(--accent-text); }

  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 64px; }
  .head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .head .sub { margin-top: 4px; color: var(--muted); }
  .back { display: inline-block; margin-bottom: 8px; text-decoration: none; font-size: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card + .card, .card + .section, .section + .card { margin-top: 16px; }
  .card.pad { padding: 16px; }
  .section { margin-top: 24px; }
  .section .head { margin-bottom: 10px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { flex: 1 1 160px; min-width: 0; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=time], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { border-top: 1px solid var(--border); }
  .rows li:first-child { border-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
  .row:hover { background: var(--surface-2); }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .row .side strong { color: var(--text); font-weight: 600; font-size: 14px; }
  .chev { color: var(--faint); flex: none; }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 650; background: var(--surface-2); color: var(--text); font-family: var(--mono); letter-spacing: .02em; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.off { background: var(--surface-2); color: var(--muted); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }
  .comps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .comp { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; font-variant-numeric: tabular-nums; }
  .comp b { color: var(--faint); font-weight: 600; margin-right: 4px; }
  .level { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; max-width: 360px; }
  .level span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .level.over span { background: var(--warn); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
  .group-head a { font-weight: 650; color: var(--text); text-decoration: none; }
  .group-head a:hover { text-decoration: underline; }
  .dip-hist { list-style: none; margin: 0; padding: 0; }
  .dip-hist li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .dip-hist li:first-child { border-top: 0; }
  .dip-hist .main { flex: 1; min-width: 0; }
  .board-site { overflow: hidden; }
  .board-site[data-status=overdue], .board-site[data-status=today] { box-shadow: inset 4px 0 0 var(--danger), var(--shadow); }
  .board-site[data-status=soon] { box-shadow: inset 4px 0 0 var(--warn), var(--shadow); }
  .bs-head { padding: 14px 16px 10px; }
  .bs-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bs-title a { font-weight: 650; font-size: 16px; color: var(--text); text-decoration: none; }
  .bs-title a:hover { text-decoration: underline; }
  .bs-when { margin-top: 6px; }
  .bs-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bg-head, .bg-row { display: grid; grid-template-columns: 64px minmax(140px, 1.5fr) 0.9fr 1.2fr 1fr; gap: 12px; align-items: center; padding: 10px 16px; }
  .bg-head { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 2px; padding-bottom: 6px; }
  .bg-row { width: 100%; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .bg-row:hover { background: var(--surface-2); }
  .bg-row .sub { display: block; font-size: 12px; color: var(--muted); }
  .bg-now .level { margin-top: 6px; }
  .bs-warn { margin: 0; padding: 10px 16px 12px 34px; border-top: 1px solid var(--border); color: var(--warn); background: var(--warn-soft); font-size: 13px; }
  .bs-warn li + li { margin-top: 2px; }

  .details { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 20px; }
  .details dt { font-size: 12px; color: var(--muted); }
  .details dd { margin: 2px 0 0; font-weight: 550; overflow-wrap: anywhere; }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
  .stats strong { color: var(--text); font-size: 15px; }

  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  .dlg-head { padding: 16px 20px 0; }
  .dlg-body { padding: 14px 20px; overflow: auto; max-height: calc(100vh - 170px); }
  .dlg-foot { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .hint { font-size: 12px; color: var(--muted); }
  .field .suffix { display: flex; align-items: center; gap: 6px; }
  .field .suffix span { color: var(--muted); font-size: 13px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 550; padding-top: 4px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .err:empty { display: none; }
  .note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--danger-soft); color: var(--danger); }
  .note.good { background: var(--ok-soft); color: var(--ok); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }

  .comp-edit { display: grid; gap: 8px; }
  .comp-line { display: flex; gap: 8px; align-items: center; }
  .comp-line b { width: 32px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .comp-line input { flex: 1; }

  .auth { max-width: 400px; margin: 8vh auto; padding: 0 16px; }
  .auth .card { padding: 24px; }
  .auth h1 { margin: 16px 0 4px; }
  .auth form { display: grid; gap: 12px; margin-top: 16px; }

  .settings-group { padding: 16px; }
  .settings-group + .settings-group { border-top: 1px solid var(--border); }
  .settings-group h2 { margin-bottom: 12px; }

  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center; background: var(--surface); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .summary { width: 100%; border-collapse: collapse; font-size: 14px; }
  .summary td, .summary th { padding: 8px 12px; border-top: 1px solid var(--border); text-align: left; }
  .summary th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .summary td.n { text-align: right; font-variant-numeric: tabular-nums; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 550; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15); min-width: 200px; padding: 6px; display: none; }
  .menu.open .menu-list { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
  .menu-list button:hover { background: var(--surface-2); }
  .menu-list .who { padding: 8px 10px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }

  @media (max-width: 560px) {
    h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
    .row { padding: 12px; }
    .hide-sm { display: none !important; }
    .bg-row { grid-template-columns: 58px 1.4fr 1fr; gap: 10px; }
    main { padding-top: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ------------------------------------------------------------ helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => (n == null || n === '' ? '' : Number(n).toLocaleString('en-AU'));
const fmtL = (n) => (n == null ? '' : fmtN(Math.round(n)) + ' L');
const fmtML = (n) => (n >= 1e6 ? (n / 1e6).toLocaleString('en-AU', { maximumFractionDigits: 2 }) + ' ML' : fmtL(n));
const plural = (n, one, many) => `${fmtN(n)} ${n === 1 ? one : many || one + 's'}`;
const pct = (litres, cap) => (cap ? Math.round((litres / cap) * 100) : 0);
const zone = () => (state.settings && state.settings.timezone) || 'Australia/Brisbane';
function fmtWhen(ms) {
  return new Intl.DateTimeFormat('en-AU', { timeZone: zone(), weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
}
function ago(ms) {
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hours = Math.round(mins / 60);
  if (hours < 48) return `${hours} h ago`;
  return `${Math.round(hours / 24)} days ago`;
}
// The current time in the company's time zone, as a datetime-local value.
function nowLocal() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: zone(), hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
const canDip = () => state.me && (state.me.role === 'admin' || state.me.role === 'dispatcher');
const icon = {
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  logo: '<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 7c3.6 4.6 6 8.1 6 11.1A6 6 0 0 1 10 18.1C10 15.1 12.4 11.6 16 7Z" fill="var(--accent-ink)"/></svg>',
};

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

async function api(path, { method = 'GET', body } = {}) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch('/api' + path, opts);
  } catch {
    throw new Error('Can’t reach the server. Check your connection and try again.');
  }
  let data = null;
  try { data = await res.json(); } catch { /* empty */ }
  if (res.status === 401 && path !== '/login' && state.me) {
    state.me = null;
    render();
  }
  if (!res.ok) {
    const err = new Error((data && data.error) || 'Something went wrong.');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* -------------------------------------------------------------- state */
const state = { me: null, needsSetup: false, cache: {}, settings: null };
const isAdmin = () => state.me && state.me.role === 'admin';

async function load(name, force) {
  if (force || !state.cache[name]) state.cache[name] = await api('/' + name);
  return state.cache[name];
}
function invalidate(...names) { for (const n of names) delete state.cache[n]; }
async function loadSettings(force) {
  if (force || !state.settings) state.settings = await api('/settings');
  return state.settings;
}

/* ---------------------------------------------------------- field defs */
const COMBOS = ['Any', 'Rigid', 'Semi', 'B-double', 'Road train'];
const CLASSES = ['Rigid', 'Semi', 'B-double', 'Road train'];
const FORMS = {
  sites: [
    { k: 'name', label: 'Site name', required: true },
    { k: 'code', label: 'Site code', hint: 'Short code, like SF-MNK' },
    { k: 'trading_name', label: 'Trading name', full: true },
    { k: 'address', label: 'Address', full: true },
    { k: 'postcode', label: 'Postcode' },
    { k: 'external_id', label: 'Price board site ID' },
    { k: 'lat', label: 'Latitude', type: 'number', step: 'any' },
    { k: 'lng', label: 'Longitude', type: 'number', step: 'any' },
    { k: 'delivery_from', label: 'Deliveries from', type: 'time', hint: 'Blank means any time' },
    { k: 'delivery_until', label: 'Deliveries until', type: 'time' },
    { k: 'max_combination', label: 'Largest combination allowed', type: 'select', options: COMBOS, blank: 'Any' },
    { k: 'drop_minutes', label: 'Average drop time', type: 'number', step: 1, suffix: 'min' },
    { k: 'contact_name', label: 'Site contact' },
    { k: 'contact_phone', label: 'Contact phone' },
    { k: 'sales_code', label: 'Sales location', hint: 'This site’s location number or name on its sales reports. Set automatically on the first upload.' },
    { k: 'active', label: 'Active', type: 'bool', def: 1 },
  ],
  tanks: [
    { k: 'site_id', label: 'Site', type: 'ref', ref: 'sites', required: true },
    { k: 'grade_id', label: 'Grade', type: 'ref', ref: 'grades', refLabel: (g) => `${g.code} – ${g.name}`, required: true },
    { k: 'name', label: 'Tank name', required: true },
    { k: 'tank_number', label: 'Tank number', hint: 'As labelled on the fill point' },
    { k: 'capacity_l', label: 'Capacity', type: 'number', step: 1, suffix: 'L', required: true },
    { k: 'calibration_on_file', label: 'Calibration chart on file', type: 'bool', def: 0 },
    { k: 'active', label: 'Active', type: 'bool', def: 1 },
    { k: 'notes', label: 'Notes', type: 'textarea', full: true },
  ],
  trucks: [
    { k: 'name', label: 'Truck name', required: true },
    { k: 'rego', label: 'Rego' },
    { k: 'depot', label: 'Home depot' },
    { k: 'combination_class', label: 'Combination class', type: 'select', options: CLASSES, blank: 'Not set' },
    { k: 'max_payload_t', label: 'Maximum payload', type: 'number', step: 'any', suffix: 't', hint: 'Used for the weight check' },
    { k: 'available', label: 'Available', type: 'bool', def: 1 },
  ],
  grades: [
    { k: 'code', label: 'Code', required: true, hint: 'Shown on load sheets, like ULP91' },
    { k: 'name', label: 'Name', required: true },
    { k: 'density', label: 'Density', type: 'number', step: 'any', suffix: 'kg/L', hint: 'For the truck weight check' },
    { k: 'sort_order', label: 'Order', type: 'number', step: 1, hint: 'Lower numbers list first' },
  ],
  terminals: [
    { k: 'name', label: 'Name', required: true },
    { k: 'address', label: 'Address', full: true },
    { k: 'lat', label: 'Latitude', type: 'number', step: 'any' },
    { k: 'lng', label: 'Longitude', type: 'number', step: 'any' },
    { k: 'open_from', label: 'Loading from', type: 'time', hint: 'Blank means 24/7' },
    { k: 'open_until', label: 'Loading until', type: 'time' },
    { k: 'grades', label: 'Grades available', full: true, hint: 'Grade codes separated by commas, like ULP91, E10, DSL' },
    { k: 'load_minutes', label: 'Average load time', type: 'number', step: 1, suffix: 'min' },
    { k: 'active', label: 'Active', type: 'bool', def: 1 },
  ],
  drivers: [
    { k: 'name', label: 'Name', required: true },
    { k: 'mobile', label: 'Mobile' },
    { k: 'licence_class', label: 'Licence class', hint: 'Like HC or MC' },
    { k: 'dg_expiry', label: 'Dangerous goods licence expiry', type: 'date' },
    { k: 'combinations', label: 'Combinations cleared for', full: true, hint: 'Like Semi, B-double' },
    { k: 'usual_shift', label: 'Usual shift', full: true, hint: 'Like Mon–Fri, 4am–2pm' },

/* ----------------------------------------------------------- dialogs */
function fieldHtml(f, value, lists) {
  const id = 'f_' + f.k;
  const req = f.required ? ' required' : '';
  const dis = isAdmin() ? '' : ' disabled';
  let input;
  if (f.type === 'bool') {
    const on = value == null ? f.def : value;
    return `<div class="field${f.full ? ' full' : ''}"><label class="check"><input type="checkbox" id="${id}" name="${f.k}"${on ? ' checked' : ''}${dis}> ${esc(f.label)}</label></div>`;
  }
  if (f.type === 'select') {
    input = `<select id="${id}" name="${f.k}"${dis}><option value="">${esc(f.blank || 'Choose…')}</option>${f.options
      .filter((o) => o !== f.blank)
      .map((o) => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`)
      .join('')}</select>`;
  } else if (f.type === 'ref') {
    const items = lists[f.ref] || [];
    input = `<select id="${id}" name="${f.k}"${req}${dis}><option value="">Choose…</option>${items
      .map((it) => `<option value="${it.id}"${it.id === value ? ' selected' : ''}>${esc(f.refLabel ? f.refLabel(it) : it.name)}</option>`)
      .join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${f.k}" rows="3"${dis}>${esc(value)}</textarea>`;
  } else {
    const type = f.type || 'text';
    const step = f.step !== undefined ? ` step="${f.step}"` : '';
    const mode = type === 'number' ? ` inputmode="${f.step === 1 ? 'numeric' : 'decimal'}"` : '';
    input = `<input type="${type}" id="${id}" name="${f.k}" value="${esc(value)}"${step}${mode}${req}${dis}>`;
    if (f.suffix) input = `<div class="suffix">${input}<span>${esc(f.suffix)}</span></div>`;
  }
  return `<div class="field${f.full ? ' full' : ''}"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

function readFields(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.k];
    if (!el) continue;
    if (f.type === 'bool') out[f.k] = el.checked;
    else if (f.type === 'number' || f.type === 'ref') out[f.k] = el.value === '' ? null : Number(el.value);
    else out[f.k] = el.value.trim() === '' ? null : el.value.trim();
  }
  return out;
}

function openDialog({ title, sub, body, onSave, onDelete, saveLabel = 'Save', deleteLabel = 'Delete', readOnly, anyRole }) {
  const dlg = $('#dlg');
  const canEdit = (isAdmin() || (anyRole && canDip())) && !readOnly;
  dlg.innerHTML = `
    <form method="dialog" novalidate>
      <div class="dlg-head"><h2>${esc(title)}</h2>${sub ? `<div class="muted" style="font-size:13px">${esc(sub)}</div>` : ''}</div>
      <div class="dlg-body">${body}<div class="err" id="dlg-err"></div></div>
      <div class="dlg-foot">
        ${canEdit && onSave ? `<button class="btn primary" value="save" type="submit">${esc(saveLabel)}</button>` : ''}
        <button class="btn" value="cancel" type="button" data-close>${canEdit && onSave ? 'Cancel' : 'Close'}</button>
        <span class="spacer"></span>
        ${canEdit && onDelete ? `<button class="btn danger ghost" type="button" data-delete>${esc(deleteLabel)}</button>` : ''}
      </div>
    </form>`;
  const form = $('form', dlg);
  const errBox = $('#dlg-err', dlg);
  $('[data-close]', dlg).onclick = () => dlg.close();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!onSave) return dlg.close();
    errBox.textContent = '';
    const btn = $('button[value=save]', dlg);
    btn.disabled = true;
    try {
      await onSave(form);
      dlg.close();
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  };
  const del = $('[data-delete]', dlg);
  if (del) {
    del.onclick = async () => {
      if (del.dataset.confirm !== '1') {
        del.dataset.confirm = '1';
        del.textContent = 'Tap again to delete';
        return;
      }
      errBox.textContent = '';
      try {
        await onDelete();
        dlg.close();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };
  }
  dlg.showModal();
  const first = $('input:not([type=checkbox]):not([disabled]), select:not([disabled]), textarea:not([disabled])', dlg);
  if (first && window.matchMedia('(pointer: fine)').matches) first.focus();
  return dlg;
}

async function editEntity(name, row, preset = {}) {
  const fields = FORMS[name];
  const lists = {};
  for (const f of fields) if (f.type === 'ref') lists[f.ref] = await load(f.ref);
  const data = { ...preset, ...(row || {}) };
  const isNew = !row;
  const extra = name === 'trucks' ? compartmentsEditor(data.compartments || []) : '';
  const tankNote = name === 'tanks' && state.settings
    ? `<div class="note full" style="grid-column:1/-1">Fills to ${Math.round(state.settings.safe_fill_pct * 100)}% of capacity. The lowest level is worked out from this tank’s sales.</div>` : '';
  openDialog({
    title: isNew ? `Add ${NOUN[name]}` : (data.name || data.code || 'Edit'),
    sub: isNew ? '' : (name === 'tanks' ? data.site_name : ''),
    body: `<div class="grid">${fields.map((f) => fieldHtml(f, data[f.k], lists)).join('')}${tankNote}</div>${extra}`,
    onSave: async (form) => {
      const body = readFields(form, fields);
      if (name === 'trucks') body.compartments = $$('.comp-line input', form).map((i) => (i.value === '' ? null : Number(i.value)));
      const missing = fields.find((f) => f.required && (body[f.k] == null || body[f.k] === ''));
      if (missing) throw new Error(`${missing.label} is required.`);
      if (isNew) await api('/' + name, { method: 'POST', body });
      else await api(`/${name}/${row.id}`, { method: 'PUT', body });
      invalidate(name, 'sites', 'tanks', 'grades');
      toast(isNew ? `${cap(NOUN[name])} added` : 'Saved');
      render();
    },
    onDelete: isNew ? null : async () => {
      await api(`/${name}/${row.id}`, { method: 'DELETE' });
      invalidate(name, 'sites', 'tanks', 'grades');
      toast(`${cap(NOUN[name])} deleted`);
      if (name === 'sites') location.hash = '#/sites';
      render();
    },
    deleteLabel: name === 'sites' ? 'Delete site and its tanks' : 'Delete',
  });
  if (name === 'trucks') wireCompartments();
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function compartmentsEditor(list) {
  const line = (v, i) => `<div class="comp-line"><b>C${i + 1}</b><input type="number" inputmode="numeric" step="1" min="1" value="${esc(v)}" aria-label="Compartment ${i + 1} litres"${isAdmin() ? '' : ' disabled'}><span class="muted">L</span>${isAdmin() ? `<button type="button" class="btn sm ghost" data-rm aria-label="Remove compartment ${i + 1}">Remove</button>` : ''}</div>`;
  return `<div class="section" style="margin-top:18px">
    <div class="head" style="margin-bottom:8px"><h2>Compartments</h2><span class="spacer"></span><span class="muted num" id="comp-total"></span></div>
    <div class="comp-edit" id="comp-list">${list.map(line).join('')}</div>
    ${isAdmin() ? '<button type="button" class="btn sm" id="comp-add" style="margin-top:10px">Add compartment</button>' : ''}
    <template id="comp-tpl">${line('', 0)}</template>
  </div>`;
}
function wireCompartments() {
  const list = $('#comp-list');
  const renumber = () => {
    $$('.comp-line', list).forEach((l, i) => { $('b', l).textContent = 'C' + (i + 1); });
    const total = $$('input', list).reduce((a, i) => a + (Number(i.value) || 0), 0);
    $('#comp-total').textContent = `${plural($$('.comp-line', list).length, 'compartment')} · ${fmtL(total)}`;
  };
  list.addEventListener('input', renumber);
  list.addEventListener('click', (e) => { if (e.target.matches('[data-rm]')) { e.target.closest('.comp-line').remove(); renumber(); } });
  const add = $('#comp-add');
  if (add) add.onclick = () => {
    list.insertAdjacentHTML('beforeend', $('#comp-tpl').innerHTML);
    renumber();
    $$('input', list).pop().focus();
  };
  renumber();
}

  const dis = isAdmin() ? '' : ' disabled';
  const group = ([title, fields]) => `<div class="settings-group"><h2>${esc(title)}</h2><div class="grid">${fields.map((f) => {
    const id = 'set_' + f.k;
    if (f.type === 'bool') return `<div class="field full"><label class="check"><input type="checkbox" id="${id}" name="${f.k}"${s[f.k] ? ' checked' : ''}${dis}> ${esc(f.label)}</label></div>`;
    if (f.type === 'select') return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" name="${f.k}"${dis}>${f.options.map((o) => `<option${o === s[f.k] ? ' selected' : ''}>${o}</option>`).join('')}</select></div>`;
    if (f.type === 'text') return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" name="${f.k}" value="${esc(s[f.k])}"${dis}>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
    const v = f.pct ? Math.round(s[f.k] * 1000) / 10 : s[f.k];
    return `<div class="field"><label for="${id}">${esc(f.label)}</label><div class="suffix"><input type="number" inputmode="decimal" step="${f.pct ? 'any' : f.step}" id="${id}" name="${f.k}" value="${esc(v)}"${dis}><span>${esc(f.suffix)}</span></div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  }).join('')}</div></div>`;
  return headHtml('Settings', 'Company-wide rules the forecasts and load plans follow.') +
    `<form id="settings-form" class="card">${SETTINGS.map(group).join('')}
      ${isAdmin() ? '<div class="settings-group" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" type="submit">Save settings</button><span class="err" id="set-err" style="margin:0"></span></div>' : '<div class="settings-group muted">Only an admin can change these.</div>'}
    </form>`;
}

async function saveSettings(form) {
  const body = {};
  for (const [, fields] of SETTINGS) for (const f of fields) {
    const el = form.elements[f.k];
    if (f.type === 'bool') body[f.k] = el.checked;
    else if (f.type === 'select' || f.type === 'text') body[f.k] = el.value;
    else {
      const v = el.value === '' ? null : Number(el.value);
      if (f.pct && (v == null || v < f.min || v > f.max)) throw new Error(`${f.label} must be between ${f.min}% and ${f.max}%.`);
      body[f.k] = v == null ? null : (f.pct ? v / 100 : v);
    }
  }
  state.settings = await api('/settings', { method: 'PUT', body });
}

/* ------------------------------------------------------- xlsx reading */
// A small .xlsx reader: unzips the file in the browser and reads sheet XML.
async function readXlsx(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('That file isn’t a valid .xlsx spreadsheet.');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const entries = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('That spreadsheet looks damaged.');
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const offset = view.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, size, offset };
    p += 46 + nameLen + extraLen + commentLen;
  }
  const readEntry = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.offset + 30 + view.getUint16(e.offset + 26, true) + view.getUint16(e.offset + 28, true);
    const data = bytes.subarray(start, start + e.size);
    if (e.method === 0) return new TextDecoder().decode(data);
    if (e.method !== 8) throw new Error('That spreadsheet uses a compression this app can’t read.');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
  const parse = (text) => new DOMParser().parseFromString(text, 'application/xml');
  const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];

  const strings = [];
  const sst = await readEntry('xl/sharedStrings.xml');
  if (sst) for (const si of tags(parse(sst), 'si')) strings.push(tags(si, 't').map((t) => t.textContent).join(''));

  const wb = parse(await readEntry('xl/workbook.xml'));
  const rels = parse(await readEntry('xl/_rels/workbook.xml.rels'));
  const targets = {};
  for (const r of tags(rels, 'Relationship')) targets[r.getAttribute('Id')] = r.getAttribute('Target');
  const colIndex = (ref) => {
    let n = 0;
    for (const ch of ref.replace(/\d+$/, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  const sheets = {};
  for (const sh of tags(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = targets[rid] || '';
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    const xml = await readEntry(target);
    if (!xml) continue;
    const rows = [];
    for (const row of tags(parse(xml), 'row')) {
      const r = Number(row.getAttribute('r')) - 1;
      const out = [];
      for (const c of tags(row, 'c')) {
        const t = c.getAttribute('t');
        const v = tags(c, 'v')[0];
        let value = null;
        if (t === 's') value = v ? strings[Number(v.textContent)] : null;
        else if (t === 'inlineStr') value = tags(c, 't').map((x) => x.textContent).join('');
        else if (t === 'str') value = v ? v.textContent : null;
        else if (t === 'b') value = v ? v.textContent === '1' : null;
        else if (t === 'e') value = null;
        else value = v ? Number(v.textContent) : null;
        out[colIndex(c.getAttribute('r'))] = value;
      }
      rows[r] = out;
    }
    sheets[sh.getAttribute('name')] = rows;
  }
  return sheets;
}

const SHEETS = {
  Grades: { key: 'grades', cols: { 'code': 'code', 'name': 'name', 'density (kg/l)': 'density', 'density': 'density' } },
  Sites: { key: 'sites', cols: {
    'site name': 'name', 'admin site code': 'code', 'site code': 'code', 'trading name': 'trading_name', 'address': 'address',
    'postcode': 'postcode', 'latitude': 'lat', 'longitude': 'lng', 'price board site id': 'external_id',
    'deliveries from': 'delivery_from', 'deliveries until': 'delivery_until', 'largest combination allowed': 'max_combination',
    'average drop time (min)': 'drop_minutes', 'site contact': 'contact_name', 'contact phone': 'contact_phone',
    'idealpos sales code': 'sales_code', 'sales code': 'sales_code', 'active': 'active' } },
  Tanks: { key: 'tanks', cols: {
    'site name': 'site', 'site': 'site', 'tank name': 'name', 'grade': 'grade', 'capacity (l)': 'capacity_l', 'active': 'active',
    'active in admin system': 'active', 'tank number at fill point': 'tank_number', 'tank number': 'tank_number',
    'calibration chart on file': 'calibration_on_file' } },
  Trucks: { key: 'trucks', cols: {
    'truck': 'name', 'rego': 'rego', 'home depot': 'depot', 'available': 'available', 'available in admin system': 'available',
    'combination class': 'combination_class', 'maximum payload (t)': 'max_payload_t' } },
  Compartments: { key: 'compartments', cols: { 'truck': 'truck', 'compartment': 'position', 'capacity (l)': 'capacity_l' } },
};
const TIME_FIELDS = new Set(['delivery_from', 'delivery_until']);
const TEXT_FIELDS = new Set(['postcode', 'external_id', 'sales_code', 'contact_phone', 'code', 'tank_number', 'rego']);

function toPayload(sheets) {
  const payload = {};
  const found = [];
  for (const [sheetName, spec] of Object.entries(SHEETS)) {
    const rows = sheets[sheetName];
    if (!rows || !rows.length) continue;
    const header = (rows[0] || []).map((h) => String(h == null ? '' : h).trim().toLowerCase());
    const map = header.map((h) => spec.cols[h] || null);
    const out = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every((v) => v == null || v === '')) continue;
      const obj = { _row: i + 1 };
      map.forEach((field, c) => {
        if (!field) return;
        let v = r[c];
        if (v === undefined) v = null;
        if (TIME_FIELDS.has(field) && typeof v === 'number') {
          const mins = Math.round((v % 1) * 1440) % 1440;
          v = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
        }
        if (TEXT_FIELDS.has(field) && typeof v === 'number') v = String(v);
        if (typeof v === 'string') v = v.trim();
        obj[field] = v;
      });
      out.push(obj);
    }
    payload[spec.key] = out;
    found.push([sheetName, out.length]);
  }
  return { payload, found };
}

function wireImport() {
  const drop = $('#drop');
  if (!drop) return;
  const out = $('#import-out');
  const handle = async (file) => {
    if (!file) return;
    out.innerHTML = '<div class="note">Reading the spreadsheet…</div>';
    let parsed;
    try {
      if (!/\.xlsx$/i.test(file.name)) throw new Error('Choose an .xlsx file.');
      parsed = toPayload(await readXlsx(await file.arrayBuffer()));
    } catch (err) {
      out.innerHTML = `<div class="note bad">${esc(err.message)}</div>`;
      return;
    }
    if (!parsed.found.length) {
      out.innerHTML = '<div class="note bad">No Sites, Tanks, Trucks, Compartments or Grades tabs were found in that file.</div>';
      return;
    }
    out.innerHTML = `<div class="card"><table class="summary"><thead><tr><th>${esc(file.name)}</th><th style="text-align:right">Rows</th></tr></thead><tbody>
      ${parsed.found.map(([n, c]) => `<tr><td>${esc(n)}</td><td class="n">${fmtN(c)}</td></tr>`).join('')}</tbody></table>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="do-import">Import these rows</button><button class="btn" id="cancel-import">Cancel</button></div></div>`;
    $('#cancel-import').onclick = () => { out.innerHTML = ''; $('#file').value = ''; };
    $('#do-import').onclick = async (e) => {
      e.target.disabled = true;
      try {
        const res = await api('/import', { method: 'POST', body: parsed.payload });
        invalidate('sites', 'tanks', 'trucks', 'grades');
        const s = res.summary;
        const line = (label, o) => (o ? `<tr><td>${label}</td><td class="n">${fmtN(o.created)}</td><td class="n">${fmtN(o.updated)}</td></tr>` : '');
        out.innerHTML = `<div class="note good" style="margin-bottom:12px">Imported. <a href="#/sites">See your sites</a></div>
          <div class="card"><table class="summary"><thead><tr><th></th><th style="text-align:right">Added</th><th style="text-align:right">Updated</th></tr></thead><tbody>
          ${line('Grades', s.grades)}${line('Sites', s.sites)}${line('Tanks', s.tanks)}${line('Trucks', s.trucks)}
          <tr><td>Compartments</td><td class="n" colspan="2">${plural(s.compartments.compartments, 'compartment')} on ${plural(s.compartments.trucks, 'truck')}</td></tr></tbody></table></div>`;
        toast('Import complete');
      } catch (err) {
        const list = err.data && err.data.errors;
        out.insertAdjacentHTML('afterbegin', `<div class="note bad" style="margin-bottom:12px">${list
          ? `Nothing was imported. Fix these in the spreadsheet and try again:<ul>${list.slice(0, 30).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${list.length > 30 ? `<div>…and ${list.length - 30} more.</div>` : ''}`
          : esc(err.message)}</div>`);
        e.target.disabled = false;
      }
    };
  };
  $('#file').onchange = (e) => handle(e.target.files[0]);
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); });
}

/* --------------------------------------------------------------- dips */
function levelBar(litres, cap) {
  const p = pct(litres, cap);
  return `<div class="level${p > 100 ? ' over' : ''}" aria-hidden="true"><span style="width:${Math.min(100, Math.max(0, p))}%"></span></div>`;
}

function dipState(dip) {
  if (!dip) return 'never';
  return Date.now() - dip.taken_at > state.settings.dip_stale_hours * 3600000 ? 'stale' : 'fresh';
}

function dipLine(tank, dip) {
  if (!tank.active) return '';
  if (!dip) return '<span class="badge warn">No dip yet</span>';
  const stale = dipState(dip) === 'stale';
  return `· ${fmtL(dip.litres)} (${pct(dip.litres, tank.capacity_l)}%) ${ago(dip.taken_at)} ${stale ? '<span class="badge warn">Out of date</span>' : ''}`;
}

async function viewDips() {
  const [sites, tanks, latest, settings] = await Promise.all([load('sites'), load('tanks'), api('/dips/latest'), loadSettings()]);
  const dipOf = new Map(latest.map((d) => [d.tank_id, d]));
  const active = tanks.filter((t) => t.active);
  const counts = { fresh: 0, stale: 0, never: 0 };
  for (const t of active) counts[dipState(dipOf.get(t.id))]++;
  const flash = state.flash;
  state.flash = null;

  const groups = sites.map((s) => {
    const mine = active.filter((t) => t.site_id === s.id);
    if (!mine.length) return '';
    const states = mine.map((t) => dipState(dipOf.get(t.id)));
    const needs = states.some((x) => x !== 'fresh');
    const rows = mine.map((t) => {
      const d = dipOf.get(t.id);
      const st = dipState(d);
      return `<li><button class="row" data-dip-tank="${t.id}">
        <div class="main"><div class="title">${esc(t.name)} <span class="chip">${esc(t.grade_code)}</span></div>
          ${d ? levelBar(d.litres, t.capacity_l) : ''}</div>
        <div class="side">${d
          ? `<strong class="num">${fmtL(d.litres)}</strong> · ${pct(d.litres, t.capacity_l)}%<br>${esc(fmtWhen(d.taken_at))} · ${ago(d.taken_at)}${st === 'stale' ? '<br><span class="badge warn">Out of date</span>' : ''}`
          : '<span class="badge warn">No dip yet</span>'}</div>${icon.chev}</button></li>`;
    }).join('');
    return `<div class="card" data-group="${esc(s.name.toLowerCase())}" data-needs="${needs ? 1 : 0}">
      <div class="group-head"><a href="#/sites/${s.id}">${esc(s.name)}</a><span class="spacer"></span>
        ${canDip() ? `<button class="btn sm" data-dip-enter="${s.id}">Enter dips</button>` : ''}</div>
      <ul class="rows">${rows}</ul></div>`;
  }).join('');

  const inactive = tanks.length - active.length;
  return headHtml('Tank dips', `Latest reading for each active tank, in litres. A dip older than ${fmtN(settings.dip_stale_hours)} hours is flagged.${inactive ? ` ${plural(inactive, 'inactive tank')} not shown.` : ''}`,
    canDip() ? '<button class="btn" data-dip-upload>Upload</button><button class="btn primary" data-dip-enter="">Enter dips</button>' : '') +
    (flash ? `<div class="note ${flash.kind}" style="margin-bottom:12px">${flash.html}</div>` : '') +
    (active.length ? `<div class="stats"><span><strong>${fmtN(counts.fresh)}</strong> up to date</span><span><strong>${fmtN(counts.stale)}</strong> out of date</span><span><strong>${fmtN(counts.never)}</strong> never dipped</span></div>
      <div class="toolbar"><input type="text" id="dq" placeholder="Search sites" aria-label="Search sites">
        <select id="dneeds" aria-label="Which sites"><option value="">All sites</option><option value="1">Sites needing a dip</option></select></div>
      <div id="dip-groups" style="display:grid;gap:16px">${groups}</div>`
      : `<div class="card">${emptyHtml('No active tanks', 'Add tanks to your sites first.')}</div>`);
}

async function enterDipsDialog(siteId) {
  const [sites, tanks, latest] = await Promise.all([load('sites'), load('tanks'), api('/dips/latest')]);
  const dipOf = new Map(latest.map((d) => [d.tank_id, d]));
  const withTanks = sites.filter((s) => tanks.some((t) => t.site_id === s.id && t.active));
  if (!withTanks.length) throw new Error('There are no active tanks to dip yet.');
  let current = withTanks.find((s) => s.id === siteId) ? siteId : withTanks[0].id;
  const inputs = (sid) => tanks.filter((t) => t.site_id === sid && t.active).map((t) => {
    const d = dipOf.get(t.id);
    return `<div class="field"><label for="dip_${t.id}">${esc(t.name)} <span class="chip">${esc(t.grade_code)}</span></label>
      <div class="suffix"><input type="text" inputmode="numeric" id="dip_${t.id}" data-tank="${t.id}" autocomplete="off" placeholder="Litres"><span>L</span></div>
      <div class="hint">Capacity ${fmtL(t.capacity_l)}${d ? ` · last ${fmtL(d.litres)}, ${ago(d.taken_at)}` : ' · no dip yet'}</div></div>`;
  }).join('');
  openDialog({
    title: 'Enter dips',
    sub: 'Litres in each tank. Leave a tank blank to skip it.',
    anyRole: true,
    body: `<div class="grid">
      <div class="field"><label for="dip_site">Site</label><select id="dip_site">${withTanks.map((s) => `<option value="${s.id}"${s.id === current ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="dip_time">Taken at</label><input type="datetime-local" id="dip_time" value="${nowLocal()}" max="${nowLocal()}"></div>
    </div><div class="grid" id="dip_inputs" style="margin-top:14px">${inputs(current)}</div>`,
    saveLabel: 'Save dips',
    onSave: async () => {
      const readings = $$('#dip_inputs input').filter((i) => i.value.trim() !== '').map((i) => ({ tank_id: Number(i.dataset.tank), litres: i.value.trim() }));
      if (!readings.length) throw new Error('Enter litres for at least one tank.');
      const when = $('#dip_time').value;
      if (!when) throw new Error('Enter when the dips were taken.');
      const res = await api('/dips', { method: 'POST', body: { taken_at: when, readings } });
      const site = withTanks.find((s) => s.id === current);
      state.flash = res.warnings.length
        ? { kind: 'warn', html: `Saved ${plural(res.saved, 'dip')} for ${esc(site.name)}, but check these:<ul>${res.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` }
        : null;

}

// ---- dip uploads: a CSV template of every active tank, filled in and uploaded as CSV or .xlsx
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

async function downloadDipTemplate() {
  const tanks = (await load('tanks')).filter((t) => t.active);
  const lines = [['Site', 'Tank', 'Grade', 'Capacity (L)', 'Litres', 'Taken at (dd/mm/yyyy hh:mm)']];
  for (const t of tanks) lines.push([t.site_name, t.name, t.grade_code, t.capacity_l, '', '']);
  const csv = '﻿' + lines.map((l) => l.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `dips-${nowLocal().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// Excel stores date-times as days since 30 Dec 1899, in wall-clock time.
function excelSerialToLocal(n) {
  const d = new Date(Math.round((n - 25569) * 86400) * 1000);
  const two = (x) => String(x).padStart(2, '0');
  return `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}T${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`;
}

// Australian dates: 5/10/2026 6:30, 05/10/2026 18:30, 5/10/26 6:30 pm.
function auDateToLocal(v) {
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})[ T,]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
  if (!m) return s;
  let [, d, mo, y, h, mi, ap] = m;
  y = y.length === 2 ? '20' + y : y;
  h = Number(h);
  if (ap) h = (h % 12) + (ap.toLowerCase() === 'pm' ? 12 : 0);
  const two = (x) => String(x).padStart(2, '0');
  return `${y}-${two(mo)}-${two(d)}T${two(h)}:${mi}`;
}

const DIP_COLS = {
  'site': 'site', 'site name': 'site', 'tank': 'tank', 'tank name': 'tank', 'grade': 'grade',
  'litres': 'litres', 'litres l': 'litres', 'dip': 'litres', 'dip l': 'litres', 'level': 'litres', 'volume': 'litres',
  'taken at': 'taken_at', 'date': 'taken_at', 'date time': 'taken_at', 'date/time': 'taken_at', 'time': 'taken_at', 'dip time': 'taken_at',
};

function dipRowsFromTable(table) {
  const header = (table[0] || []).map((h) => String(h == null ? '' : h).toLowerCase().replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim());
  const map = header.map((h) => DIP_COLS[h] || null);
  if (!map.includes('site') || !map.includes('litres')) throw new Error('The file needs at least a Site column and a Litres column. Start from the template.');
  const rows = [];
  let skipped = 0;
  for (let i = 1; i < table.length; i++) {
    const r = table[i];
    if (!r || r.every((v) => v == null || String(v).trim() === '')) continue;
    const o = { _row: i + 1 };
    map.forEach((f, c) => {
      if (!f) return;
      let v = r[c];
      if (v == null) return;
      if (f === 'taken_at') v = typeof v === 'number' ? excelSerialToLocal(v) : auDateToLocal(v);
      else if (typeof v === 'string') v = v.trim();
      if (v !== '') o[f] = v;
    });
    if (o.litres == null) { skipped++; continue; }
    rows.push(o);
  }
  return { rows, skipped };
}
