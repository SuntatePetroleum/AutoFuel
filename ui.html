const normWords = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, ' ').trim();

function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}

// Best guess at which site a report belongs to, from its file name.
function guessSite(fileName, sites) {
  const skip = new Set(['sales', 'sale', 'pdf', 'report', 'trend', 'stock', 'item', 'items', 'idealpos']);
  const words = normWords(fileName.replace(/\.pdf$/i, '').replace(/([a-z])([A-Z])/g, '$1 $2')).split(' ').filter((w) => w.length >= 3 && !skip.has(w) && !/^\d+$/.test(w));
  const squashedFile = normWords(fileName.replace(/\.pdf$/i, '')).replace(/ /g, '');
  let best = null;
  let bestScore = 0;
  let tie = false;
  for (const s of sites) {
    const siteWords = normWords([s.name, s.trading_name, s.address].join(' ')).split(' ').filter((w) => w.length >= 3);
    const squashed = normWords(s.name).replace(/ /g, '');
    let score = squashedFile.includes(squashed) ? 2 : 0;
    for (const w of words) {
      if (siteWords.some((x) => x === w || (w.length >= 5 && editDistance(x, w) <= 1))) score++;
    }
    if (score > bestScore) { best = s; bestScore = score; tie = false; }
    else if (score === bestScore && score > 0) tie = true;
  }
  return bestScore > 0 && !tie ? best : null;
}

// Best guess at which grade a point-of-sale item is (null: not fuel).
function guessGrade(name, grades) {
  const n = normWords(name);
  const byCode = (code) => grades.find((g) => g.code.toUpperCase() === code) || null;
  const byName = (re) => grades.find((g) => re.test(normWords(g.name))) || null;
  if (/adblue|lpg|oil|wash|gas|kero|bottle/.test(n)) return null;
  if (/prem\w* (diesel|dsl)|pm (diesel|dsl)|pdsl|vortex diesel|v power diesel/.test(n)) return byCode('PDSL') || byName(/premium diesel/);
  if (/diesel|dsl|ulsd/.test(n)) return byCode('DSL') || byName(/^diesel/);
  if (/e ?85/.test(n)) return byCode('E85') || byName(/e85/);
  if (/e ?10/.test(n)) return byCode('E10') || byName(/e10/);
  if (/98/.test(n)) return byCode('ULP98') || byName(/98/);
  if (/95/.test(n)) return byCode('ULP95') || byName(/95/);
  if (/ulp|unleaded|91|petrol/.test(n)) return byCode('ULP91') || byName(/91|unleaded/);
  return undefined;
}

    if (window.matchMedia('(max-width: 560px)').matches) $$('[data-sm-notes]').forEach((el) => { if (el.textContent) el.style.display = 'block'; });
  };

  const upload = async (btn) => {
    if (btn) btn.disabled = true;
    try {
      // Check the links first, then send the reports a few at a time.
      const outline = pending.reports.map((r) => ({ file: r.file, location: r.location, items: r.items.map((i) => ({ code: i.code, name: i.name })) }));
      const check = await api('/sales/import', { method: 'POST', body: { reports: outline, check: true } });
      if (check.errors.length) throw Object.assign(new Error('Nothing was uploaded.'), { data: { errors: check.errors } });
      if (check.needs.locations.length || check.needs.items.length) return linkStep(check.needs);
      const res = { reports: [] };
      for (let i = 0; i < pending.reports.length; i += 4) {
        out.innerHTML = `<div class="note">Uploading ${fmtN(Math.min(i + 4, pending.reports.length))} of ${plural(pending.reports.length, 'report')}\u2026</div>`;
        const part = await api('/sales/import', { method: 'POST', body: { reports: pending.reports.slice(i, i + 4).map((r) => ({ ...r, items: r.items.map(({ code, name, days }) => ({ code, name, days })) })) } });
        res.reports.push(...part.reports);
      }
      invalidate('sites');
      if (pending.inbox && pending.inbox.length) {
        await api('/feed/results', { method: 'PUT', body: { results: pending.inbox.map((id) => ({ id, status: 'imported', note: 'Loaded after linking.' })) } });
      }
      state.salesResult = res;
      toast('Sales uploaded');
      render();
    } catch (err) {
      if (err.status === 409 && err.data && err.data.needs) return linkStep(err.data.needs);
      const list = err.data && err.data.errors;
      out.insertAdjacentHTML('afterbegin', `<div class="note bad" style="margin-bottom:12px">${list ? `Nothing was uploaded:<ul>${list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : esc(err.message)}</div>`);
      if (btn) btn.disabled = false;
    }
  };

  // First upload from a location or with a new item: say which site and grade they are.
  const linkStep = async (needs) => {
    const [sites, grades] = await Promise.all([load('sites', true), load('grades', true)]);
    if (!isAdmin()) {
      out.innerHTML = `<div class="note warn">These need linking before the sales can go in, and only an admin can do that:<ul>
        ${needs.locations.map((l) => `<li>${esc(locationLabel(l.location))} (${esc(l.file)})</li>`).join('')}
        ${needs.items.map((i) => `<li>${esc(itemLabel(i))}</li>`).join('')}</ul></div>`;
      return;
    }
    const free = sites.filter((s) => !s.sales_code);
    const used = new Set();
    const locRows = needs.locations.map((l, k) => {
      const guess = guessSite(/^\d+$/.test(l.location) ? l.file : l.location, free.filter((s) => !used.has(s.id)));
      if (guess) used.add(guess.id);
      return `<div class="field"><label for="loc_${k}">${esc(locationLabel(l.location))} <span class="muted" style="font-weight:400">${esc(l.file)}</span></label>
        <select id="loc_${k}" data-loc="${esc(l.location)}"><option value="">Choose a site…</option>${free.map((s) => `<option value="${s.id}"${guess && guess.id === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`;
    }).join('');
    // Which tanks each EMC grade is sold from, per site. Litres come out of the tank, so a
    // premium diesel sold only from diesel tanks is counted as diesel.
    const tanksOf = new Map();
    for (const r of pending.reports) {
      for (const it of r.items) {
        if (!it.tanks || !it.tanks.length) continue;
        if (!tanksOf.has(it.code)) tanksOf.set(it.code, []);
        tanksOf.get(it.code).push({ site: r.location, tanks: it.tanks, tankDays: it.tankDays, items: r.items });
      }
    }
    const nameGuess = (name) => guessGrade(name, grades);
    const itemRows = needs.items.map((i, k) => {
      let guess = nameGuess(i.item_name);
      let note = '';
      const where = tanksOf.get(i.item_code);
      if (where) {
        let allDiesel = guess && guess.code === 'PDSL';
        const parts = [];
        for (const w of where) {
          const others = w.items.filter((o) => o.code !== i.item_code && o.tanks && o.tanks.some((t) => w.tanks.includes(t)));
          parts.push(`tank${w.tanks.length > 1 ? 's' : ''} ${w.tanks.join(', ')} at ${w.site}${others.length ? ` (also ${others.map((o) => o.name).join(', ')})` : ''}`);
          // Diesel sold from the same tank on most of the same days (not a tank that changed grade).
          const together = (t, o) => {
            const mine = w.tankDays[t] || [];
            const theirs = new Set((o.tankDays && o.tankDays[t]) || []);
            return mine.length > 0 && mine.filter((d) => theirs.has(d)).length >= mine.length / 2;
          };
          if (!w.tanks.every((t) => others.some((o) => (nameGuess(o.name) || {}).code === 'DSL' && together(t, o)))) allDiesel = false;
        }
        if (allDiesel) guess = grades.find((g) => g.code === 'DSL') || guess;
        note = `Sold from ${parts.join('; ')}.` + (allDiesel ? ' Counted as diesel because it comes out of the diesel tanks.' : '');
      }
      return `<div class="field"><label for="itm_${k}">${esc(itemLabel(i))}</label>
        <select id="itm_${k}" data-item="${esc(i.item_code)}" data-name="${esc(i.item_name)}"><option value="none"${guess === null ? ' selected' : ''}>Not fuel – skip</option>
        ${grades.map((g) => `<option value="${g.id}"${guess && guess.id === g.id ? ' selected' : ''}>${esc(g.code)} – ${esc(g.name)}</option>`).join('')}
        ${guess === undefined ? '<option value="" selected>Choose…</option>' : ''}</select>${note ? `<div class="hint">${esc(note)}</div>` : ''}</div>`;
    }).join('');
    out.innerHTML = `<div class="card pad">
      <h2>Link these the first time</h2>
      <p class="muted" style="margin:4px 0 14px">The app has filled in its best guesses. Check them; next time these reports upload without asking.</p>
      ${locRows ? `<h3 style="font-size:14px;margin:0 0 8px">Locations on the reports → sites</h3><div class="grid">${locRows}</div>` : ''}
      ${itemRows ? `<h3 style="font-size:14px;margin:16px 0 8px">Items on the reports → grades</h3><div class="grid">${itemRows}</div>` : ''}
      <div class="err" id="link-err"></div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn primary" id="link-save">Save links and upload</button><button class="btn" id="link-cancel">Cancel</button></div>
    </div>`;
    $('#link-cancel').onclick = () => { out.innerHTML = ''; $('#sales-files').value = ''; };
    $('#link-save').onclick = async (e) => {
      const btn = e.target;
      $('#link-err').textContent = '';
      const locs = $$('[data-loc]', out).map((el) => ({ location: el.dataset.loc, site: Number(el.value) }));
      const its = $$('[data-item]', out).map((el) => ({ item_code: el.dataset.item, item_name: el.dataset.name, value: el.value }));
      const missingLoc = locs.find((l) => !l.site);
      if (missingLoc) { $('#link-err').textContent = `Choose a site for ${locationLabel(missingLoc.location)}.`; return; }
      const dupe = locs.find((l, i) => locs.findIndex((x) => x.site === l.site) !== i);
      if (dupe) { $('#link-err').textContent = 'Two locations are linked to the same site.'; return; }
      const missingItem = its.find((i) => i.value === '');
      if (missingItem) { $('#link-err').textContent = `Choose a grade for ${itemLabel(missingItem)}, or mark it not fuel.`; return; }
      btn.disabled = true;
      try {
        for (const l of locs) await api(`/sites/${l.site}`, { method: 'PUT', body: { sales_code: l.location } });
        if (its.length) await api('/sales/items', { method: 'PUT', body: { items: its.map((i) => ({ item_code: i.item_code, item_name: i.item_name, grade_id: i.value === 'none' ? null : Number(i.value) })) } });
        invalidate('sites');
        await upload(null);
      } catch (err) {
        $('#link-err').textContent = err.message;
        btn.disabled = false;
      }
    };
  };

  if (state.salesResult) {
    showResults(state.salesResult);
    state.salesResult = null;
  }

  const handle = async (files, inbox) => {
    files = [...files].filter((f) => f);
    if (!files.length) return;
    out.innerHTML = `<div class="note">Reading ${plural(files.length, 'file')}…</div>`;
    const reports = [];
    const failed = [];
    for (const f of files) {
      try {
        if (/\.pdf$/i.test(f.name)) {
          reports.push({ file: f.name, ...(await readIdealposTrend(await f.arrayBuffer())) });
        } else if (/\.xlsx$/i.test(f.name)) {
          const found = readEmcFuelSales(await readXlsx(await f.arrayBuffer()));
          if (!found) throw new Error('This spreadsheet isn’t an EMC Fuel Sales Report.');
          for (const r of found) reports.push({ file: f.name, ...r });
        } else throw new Error('Choose PDF or Excel (.xlsx) files.');
      } catch (err) {
        failed.push({ file: f.name, error: err.message });
      }
    }
    pending = { reports, inbox };
    const sameLoc = reports.filter((r, i) => reports.findIndex((x) => x.location === r.location) !== i);
    out.innerHTML = `<div class="card"><table class="summary"><thead><tr><th>Report</th><th class="hide-sm">Location</th><th style="text-align:right">Days</th></tr></thead><tbody>
      ${reports.map((r) => `<tr><td><strong>${esc(r.source === 'EMC' ? r.location : r.file)}</strong><div class="muted" style="font-size:12px">${r.source === 'EMC' ? `${esc(r.file)} · ` : ''}${esc(fmtDayShort(r.start))} – ${esc(fmtDayShort(r.end))} · ${plural(r.items.length, 'item')}${r.missing.length ? ` · ${plural(r.missing.length, 'day')} missing` : ''}</div></td>
        <td class="hide-sm">${esc(r.location)}</td><td class="n">${fmtN(Object.keys(r.items[0] ? r.items[0].days : {}).length)}</td></tr>`).join('')}
      ${failed.map((f) => `<tr><td><strong>${esc(f.file)}</strong><div style="color:var(--danger);font-size:13px">${esc(f.error)}</div></td><td class="hide-sm"></td><td class="n">—</td></tr>`).join('')}
      </tbody></table>
      ${sameLoc.length ? `<div class="note warn" style="margin:0 16px 12px">Several reports are for the same location. Where their days overlap, the later file wins.</div>` : ''}
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap">
        ${reports.length ? `<button class="btn primary" id="sales-go">Upload ${reports.length === 1 ? '1 site' : `${fmtN(reports.length)} sites`}</button>` : ''}<button class="btn" id="sales-cancel">Cancel</button>
        ${failed.length ? `<span class="muted" style="align-self:center;font-size:13px">${plural(failed.length, 'file')} couldn’t be read and will be skipped.</span>` : ''}</div></div>`;
    $('#sales-cancel').onclick = () => { out.innerHTML = ''; $('#sales-files').value = ''; };
    if (reports.length) $('#sales-go').onclick = (e) => upload(e.target);
  };
  $('#sales-files').onchange = (e) => handle(e.target.files);
  wireFeedCard(handle);
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files); });
}

/* ---------------------------------------------------------- sales feed */
// Reports emailed (or posted) to the sales feed wait on the server until the app opens.
// They're read here with the same readers as an upload: reports whose locations and items
// are already linked go straight in, oldest first; the rest wait on the Sales screen.
let feedRun = null;
let feedCheckedAt = 0;
const b64ToBuffer = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0)).buffer;

async function readFeedFile(f) {
  const buffer = b64ToBuffer(f.data);
  if (/\.pdf$/i.test(f.filename)) return [{ file: f.filename, ...(await readIdealposTrend(buffer)) }];
  if (/\.xlsx$/i.test(f.filename)) {
    const found = readEmcFuelSales(await readXlsx(buffer));
    if (!found) throw new Error('This spreadsheet isn’t an EMC Fuel Sales Report.');
    return found.map((r) => ({ file: f.filename, ...r }));
  }
  throw new Error('Not a PDF or Excel (.xlsx) file.');
}

async function loadFeedFiles(files) {
  const results = [];
  const byFile = new Map();
  for (const f of files) {
    try {
      // A report that doesn't say when it was printed counts as at the time it arrived.
      byFile.set(f.id, (await readFeedFile(f)).map((r) => (r.printed ? r : { ...r, as_at: f.received_at })));
    } catch (err) {
      results.push({ id: f.id, status: 'failed', note: err.message });
    }
  }
  // Several copies of a report waiting (it's sent every hour or two, and the app wasn't opened
  // for a while): only the newest goes in, as long as it covers the same sites and days.
  // Newest by print time where reports have one (Idealpos), otherwise by arrival (EMC).
  const received = new Map(files.map((f) => [f.id, f.received_at]));
  const newer = ([g, gr], [f, fr]) => (gr[0].printed && fr[0].printed ? gr[0].printed > fr[0].printed
    : !gr[0].printed && !fr[0].printed && received.get(g) > received.get(f));
  const covers = (gr, fr) => fr.every((r) => gr.some((o) => o.location === r.location && o.start <= r.start && o.end >= r.end));
  const waiting = [...byFile];
  for (const entry of waiting) {
    if (waiting.some((other) => other[0] !== entry[0] && newer(other, entry) && covers(other[1], entry[1]))) {
      byFile.delete(entry[0]);
      results.push({ id: entry[0], status: 'imported', note: 'Replaced by a newer copy of the same report.' });
    }
  }
  const partShort = (p) => `${p.day === localIsoOf(Date.now()) ? 'today' : fmtDayShort(p.day)} to ${fmtTime(p.at)}`;
  let loaded = 0;
  const all = [...byFile.values()].flat();
  if (all.length) {
    const outline = all.map((r) => ({ file: r.file, location: r.location, items: r.items.map((i) => ({ code: i.code, name: i.name })) }));
    const check = await api('/sales/import', { method: 'POST', body: { reports: outline, check: true } });
    const locs = new Set(check.needs.locations.map((l) => l.location));
    const items = new Map(check.needs.items.map((i) => [i.item_code, i]));
    for (const [id, reports] of byFile) {
      const why = [];
      for (const r of reports) {
        const loc = String(r.location).trim();
        if (locs.has(loc)) why.push(`${locationLabel(loc)} isn’t linked to a site`);
        for (const it of r.items) {
          const code = String(it.code).trim();
          if (items.has(code)) why.push(`${itemLabel(items.get(code))} isn’t linked to a grade`);
        }
        for (const e of check.errors) if (e.startsWith(`${r.file}:`)) why.push(e.slice(r.file.length + 1).trim());
      }
      if (why.length) {
        results.push({ id, status: 'attention', note: `${[...new Set(why)].join('; ')}.` });
        continue;
      }
      try {
        const res = await api('/sales/import', { method: 'POST', body: { reports: reports.map((r) => ({ ...r, items: r.items.map(({ code, name, days }) => ({ code, name, days })) })) } });
        results.push({ id, status: 'imported', note: res.reports.map((x) => `${x.site}: ${[x.first ? `${fmtDayShort(x.first)} – ${fmtDayShort(x.last)}` : '', x.partial ? partShort(x.partial) : ''].filter(Boolean).join(' and ') || 'no finished days'}`).join('; ') });
        loaded++;
      } catch (err) {
        results.push({ id, status: 'failed', note: err.message });
      }
    }
  }
  if (results.length) await api('/feed/results', { method: 'PUT', body: { results } });
  return { loaded, attention: results.filter((r) => r.status === 'attention').length, failed: results.filter((r) => r.status === 'failed').length };
}

// Reads anything waiting in the feed. Runs before the board, plan and sales screens, at
// most once a minute unless `force`; shows a note in `main` while it works.
function syncFeed(main, force) {
  if (!canDip()) return null;
  if (feedRun) return feedRun;
  if (!force && Date.now() - feedCheckedAt < 60000) return null;
  feedCheckedAt = Date.now();
  feedRun = (async () => {
    const total = { loaded: 0, attention: 0, failed: 0 };
    for (let round = 0; round < 10; round++) {
      const files = await api('/feed/claim', { method: 'POST', body: {} });
      if (!files.length) break;
      if (main) main.innerHTML = `<div class="note">Loading ${plural(files.length, 'emailed sales report')}…</div>`;
      const r = await loadFeedFiles(files);
      total.loaded += r.loaded;
      total.attention += r.attention;
      total.failed += r.failed;
    }
    const parts = [];
    if (total.loaded) parts.push(`Loaded ${plural(total.loaded, 'emailed sales report')}`);
    if (total.attention) parts.push(`${plural(total.attention, 'report')} need${total.attention === 1 ? 's' : ''} linking on the Sales screen`);
    if (total.failed) parts.push(`${plural(total.failed, 'report')} couldn’t be read`);
    if (parts.length) toast(parts.join('. ') + '.');
    if (total.loaded) invalidate('sites');
    return total;
  })()
    .catch((err) => { console.warn('Sales feed:', err); return null; })
    .finally(() => { feedRun = null; });
  return feedRun;
}

const FEED_STATUS = { new: ['', 'Waiting'], processing: ['', 'Reading'], imported: ['ok', 'Loaded'], attention: ['warn', 'Needs linking'], failed: ['bad', 'Couldn’t read'] };

function feedCardHtml(feed) {
  if (!feed) return '';
  const files = feed.files.slice(0, 15);
  const steps = `<ol class="feed-steps">
      ${isAdmin() && !feed.domain_fixed ? `<li><strong>Once, in Cloudflare:</strong> pick a domain in your Cloudflare account. If staff email already uses it, use a subdomain such as reports.yourdomain, so their email isn’t touched. Open Email → Email Routing, turn it on for that domain or subdomain, and add a catch-all rule that sends to the Worker <strong>autofuel</strong>. Then enter the domain under Feed settings here.</li>` : ''}
      <li><strong>In the Idealpos back office,</strong> run the Stock Item Sales Trend report for one site (Location from and to that site’s code), listed by day, with the date range Month to Date. Press View, then the S button to save it as a shortcut. Do the same for each site.</li>
      <li><strong>Setup → Schedules:</strong> add a schedule with report type Email on the back office terminal, sent to the address above, as PDF, every 2 hours through the day, with the last run late in the evening. If a schedule can only run once a day, add several at different times. Drag in all the shortcuts: they go as separate attachments on one email. Each report counts today’s sales up to the time it was printed.</li>
      <li><strong>EMC sites:</strong> if ezi-manager can email its Fuel Sales or Fuel Sales – Daily report as Excel, with every site ticked and a date range that runs to today, send it to the same address too.</li>
    </ol>`;
  const rows = files.map((f) => {
    const [cls, label] = FEED_STATUS[f.status] || ['', f.status];
    return `<tr><td><strong>${esc(f.filename)}</strong><span class="sub">${esc(fmtWhen(f.received_at))} · ${esc(f.via === 'upload' ? 'sent by a script' : f.sender || 'email')}</span>${f.note ? `<span class="sub">${esc(f.note)}</span>` : ''}</td>
      <td class="n"><span class="badge ${cls}">${esc(label)}</span>${f.status === 'attention' ? `<br><button class="btn sm" style="margin-top:6px" data-feed-open="${f.id}">Link and load</button>` : ''}${f.status === 'failed' && f.kept ? `<br><span style="display:inline-flex;gap:6px;margin-top:6px"><button class="btn sm" data-feed-view="${f.id}">Open</button><button class="btn sm" data-feed-retry="${f.id}">Try again</button></span>` : ''}</td></tr>`;
  }).join('');
  return `<div class="card pad" id="feed-card" style="margin-bottom:16px">
    <div class="head" style="margin-bottom:6px"><h2>Automatic sales feed</h2><span class="spacer"></span>
      <button class="btn sm" id="feed-check">Check now</button>${isAdmin() ? '<button class="btn sm" id="feed-settings">Feed settings</button>' : ''}</div>
    ${feed.address
      ? `<p style="margin:0 0 8px">Email sales reports to this address and they load by themselves when the app is next opened:</p>
         <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="feed-address" id="feed-address">${esc(feed.address)}</span><button class="btn sm" id="feed-copy">Copy</button></div>`
      : `<p class="muted" style="margin:0">Reports can be emailed in and loaded by themselves. ${isAdmin() ? 'To switch this on, set up an email domain (step 1 below).' : 'An admin needs to switch this on.'}</p>`}
    <details style="margin-top:12px"${feed.address && files.length ? '' : ' open'}><summary style="cursor:pointer;font-weight:600">How to set it up</summary><div style="margin-top:10px">${steps}</div></details>
    ${files.length ? `<table class="summary feed-files" style="margin-top:14px"><thead><tr><th>Report</th><th class="n">Status</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
  </div>`;
}

function wireFeedCard(handle) {
  const card = $('#feed-card');
  if (!card) return;
  const feed = state.feed;
  const copy = $('#feed-copy');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(feed.address); toast('Address copied'); } catch { toast(feed.address); }
  };
  $('#feed-check').onclick = async (e) => {
    e.target.disabled = true;
    await syncFeed(null, true);
    render();
  };
  const settings = $('#feed-settings');
  if (settings) settings.onclick = () => feedSettingsDialog(feed);
  // A report that couldn't be read: open it to look at, or read it again (after an update).
  for (const btn of $$('[data-feed-view]', card)) {
    btn.onclick = async () => {
      const win = window.open('', '_blank');
      try {
        const f = await api(`/feed/files/${btn.dataset.feedView}`);
        const url = URL.createObjectURL(new Blob([b64ToBuffer(f.data)], { type: f.content_type || (/\.pdf$/i.test(f.filename) ? 'application/pdf' : 'application/octet-stream') }));
        if (win) win.location = url;
        else Object.assign(document.createElement('a'), { href: url, download: f.filename }).click();
      } catch (err) {
        if (win) win.close();
        toast(err.message);
      }
    };
  }
  for (const btn of $$('[data-feed-retry]', card)) {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await api('/feed/results', { method: 'PUT', body: { results: [{ id: Number(btn.dataset.feedRetry), status: 'new', note: null }] } });
        await syncFeed(null, true);
      } catch (err) {
        toast(err.message);
      }
      render();
    };
  }
  for (const btn of $$('[data-feed-open]', card)) {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const f = await api(`/feed/files/${btn.dataset.feedOpen}`);
        const file = new File([b64ToBuffer(f.data)], f.filename, { type: f.content_type || '' });
        await handle([file], [f.id]);
        // Straight on to the upload, which asks for the missing links.
        const go = $('#sales-go');
        if (go) go.click();
        $('#sales-out').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        toast(err.message);
        btn.disabled = false;
      }
    };
  }
}

function feedSettingsDialog(feed) {
  openDialog({
    title: 'Sales feed settings',
    body: `<div class="grid">
      <div class="field full"><label for="fd_domain">Email domain</label><input id="fd_domain" value="${esc(feed.domain || '')}" placeholder="reports.example.com"${feed.domain_fixed ? ' disabled' : ''}>
