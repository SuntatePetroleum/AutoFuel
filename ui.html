<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>Fuel Scheduler</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #14181f; --muted: #5b6472; --faint: #8a93a0;
    --border: #e1e5ea; --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fff0e8; --accent-text: #b33a08;
    --danger: #c92a2a; --danger-soft: #fdecec; --ok: #2b8a3e; --ok-soft: #e9f6ec; --warn: #a15c00; --warn-soft: #fff4e0;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1115; --surface: #161a20; --surface-2: #1d222a; --text: #e7eaee; --muted: #a0a9b4; --faint: #77808c;
      --border: #272d36; --accent: #ff7a33; --accent-ink: #1a0b02; --accent-soft: #2a1a10; --accent-text: #ff9a5c;
      --danger: #ff6b6b; --danger-soft: #2c1517; --ok: #5ccf7a; --ok-soft: #12261a; --warn: #f0b04a; --warn-soft: #2a2010;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
  a { color: var(--accent-text); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; }

  header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; color: var(--text); min-width: 0; }
  .brand svg { flex: none; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  nav.tabs { max-width: 1000px; margin: 0 auto; display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { flex: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14px; }
  nav.tabs a:hover { background: var(--surface-2); color: var(--text); }
  nav.tabs a.on { background: var(--accent-soft); color: var(--accent-text); }

  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 64px; }
  .head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .head .sub { margin-top: 4px; color: var(--muted); }
  .back { display: inline-block; margin-bottom: 8px; text-decoration: none; font-size: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card + .card, .card + .section, .section + .card { margin-top: 16px; }
  .card.pad { padding: 16px; }
  .section { margin-top: 24px; }
  .section .head { margin-bottom: 10px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { flex: 1 1 160px; min-width: 0; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=time], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { border-top: 1px solid var(--border); }
  .rows li:first-child { border-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
  .row:hover { background: var(--surface-2); }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .row .side strong { color: var(--text); font-weight: 600; font-size: 14px; }
  .chev { color: var(--faint); flex: none; }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 650; background: var(--surface-2); color: var(--text); font-family: var(--mono); letter-spacing: .02em; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.off { background: var(--surface-2); color: var(--muted); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }
  .comps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .comp { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; font-variant-numeric: tabular-nums; }
  .comp b { color: var(--faint); font-weight: 600; margin-right: 4px; }
  .level { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; max-width: 360px; }
  .level { position: relative; }
  .level span { position: absolute; left: 0; top: 0; display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .level span.was { opacity: 0.25; }
  .dip-was { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: normal; }
  .nw { white-space: nowrap; }
  .dip-side { max-width: 58%; }
  .level.over span { background: var(--warn); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
  .group-head a { font-weight: 650; color: var(--text); text-decoration: none; }
  .group-head a:hover { text-decoration: underline; }
  .dip-hist { list-style: none; margin: 0; padding: 0; }
  .dip-hist li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .dip-hist li:first-child { border-top: 0; }
  .dip-hist .main { flex: 1; min-width: 0; }
  .board-site { overflow: hidden; }
  .board-site[data-status=overdue], .board-site[data-status=today] { box-shadow: inset 4px 0 0 var(--danger), var(--shadow); }
  .board-site[data-status=soon] { box-shadow: inset 4px 0 0 var(--warn), var(--shadow); }
  .bs-head { padding: 14px 16px 10px; }
  .bs-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bs-title a { font-weight: 650; font-size: 16px; color: var(--text); text-decoration: none; }
  .bs-title a:hover { text-decoration: underline; }
  .bs-when { margin-top: 6px; }
  .bs-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bg-head, .bg-row { display: grid; grid-template-columns: 64px minmax(140px, 1.5fr) 0.9fr 1.2fr 1fr; gap: 12px; align-items: center; padding: 10px 16px; }
  .bg-head { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 2px; padding-bottom: 6px; }
  .bg-row { width: 100%; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .bg-row:hover { background: var(--surface-2); }
  .bg-row .sub { display: block; font-size: 12px; color: var(--muted); }
  .bg-now .level { margin-top: 6px; }
  .bs-warn { margin: 0; padding: 10px 16px 12px 34px; border-top: 1px solid var(--border); color: var(--warn); background: var(--warn-soft); font-size: 13px; }
  .bs-warn li + li { margin-top: 2px; }
  .summary th.n { text-align: right; }
  .plan-start { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .plan-start input { width: auto; min-width: 140px; padding: 7px 9px; }
  .run { overflow: hidden; }
  .run-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .run-head select { width: auto; min-width: 150px; font-weight: 600; }
  .run-stop { display: flex; gap: 10px; align-items: center; padding: 12px 16px 6px; flex-wrap: wrap; }
  .run-stop select { flex: 1 1 220px; width: auto; }
  .run-stop input[type=time] { width: auto; min-width: 140px; }
  .run-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .run-sum { padding: 0 16px 6px 50px; }
  .plan-table { font-size: 13px; }
  .plan-table td, .plan-table th { padding: 6px 8px; }
  .plan-table tr.over td { color: var(--danger); }
  .plan-table td { white-space: nowrap; vertical-align: top; }
  .plan-table .sub { display: block; font-size: 11px; color: var(--muted); }
  .run-weight { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 16px 12px; font-size: 13px; color: var(--muted); }
  .run-weight strong { color: var(--text); }
  .feed-address { font-family: var(--mono); font-size: 14px; word-break: break-all; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }
  .feed-steps { margin: 0; padding-left: 20px; font-size: 14px; }
  .feed-steps li + li { margin-top: 6px; }
  .feed-files td { vertical-align: top; overflow-wrap: anywhere; }
  .feed-files td.n { white-space: nowrap; }
  .feed-files .sub, .deliver .sub { display: block; font-size: 12px; color: var(--muted); }
  .deliver td .suffix { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .deliver td .suffix input { width: 110px; text-align: right; }
  .deliver h3 { margin: 0 0 8px; font-size: 15px; }
  .run-comp.part span { color: var(--warn); }
  .run-comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .run-comp { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .run-comp b { color: var(--text); margin-right: 4px; }
  .run-comp select { padding: 6px 8px; font-size: 13px; }
  .run-comp.empty select { color: var(--muted); }
  .run-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }

  .details { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 20px; }
  .details dt { font-size: 12px; color: var(--muted); }
  .details dd { margin: 2px 0 0; font-weight: 550; overflow-wrap: anywhere; }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
  .stats strong { color: var(--text); font-size: 15px; }

  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  .dlg-head { padding: 16px 20px 0; }
  .dlg-body { padding: 14px 20px; overflow: auto; max-height: calc(100vh - 170px); }
  .dlg-foot { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .hint { font-size: 12px; color: var(--muted); }
  .field .suffix { display: flex; align-items: center; gap: 6px; }
  .field .suffix span { color: var(--muted); font-size: 13px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 550; padding-top: 4px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .err:empty { display: none; }
  .note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--danger-soft); color: var(--danger); }
  .note.good { background: var(--ok-soft); color: var(--ok); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }

  .comp-edit { display: grid; gap: 8px; }
  .comp-line { display: flex; gap: 8px; align-items: center; }
  .comp-line b { width: 32px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .comp-line input { flex: 1; min-width: 0; }
  .comp-line select { width: auto; flex: none; }
  .comp-unit { font-size: 11px; color: var(--muted); align-self: center; margin-left: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .comp-unit:first-child { margin-left: 0; }
  .weights td, .weights th { padding: 6px 6px; }
  .weights input { width: 100%; min-width: 64px; max-width: 110px; }
  .weights td.n { white-space: nowrap; }

  .auth { max-width: 400px; margin: 8vh auto; padding: 0 16px; }
  .auth .card { padding: 24px; }
  .auth h1 { margin: 16px 0 4px; }
  .auth form { display: grid; gap: 12px; margin-top: 16px; }

  .settings-group { padding: 16px; }
  .settings-group + .settings-group { border-top: 1px solid var(--border); }
  .settings-group h2 { margin-bottom: 12px; }

  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center; background: var(--surface); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .summary { width: 100%; border-collapse: collapse; font-size: 14px; }
  .summary td, .summary th { padding: 8px 12px; border-top: 1px solid var(--border); text-align: left; }
  .summary th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .summary td.n { text-align: right; font-variant-numeric: tabular-nums; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 550; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15); min-width: 200px; padding: 6px; display: none; }
  .menu.open .menu-list { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
  .menu-list button:hover { background: var(--surface-2); }
  .menu-list .who { padding: 8px 10px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }

  @media (max-width: 560px) {
    h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
    .row { padding: 12px; }
    .hide-sm { display: none !important; }
    .bg-row { grid-template-columns: 58px 1.4fr 1fr; gap: 10px; }
    .run-sum { padding-left: 16px; padding-right: 12px; }
    .plan-table td, .plan-table th { padding: 6px 4px; }
    .run-comps { grid-template-columns: 1fr 1fr; }
    .plan-start { width: 100%; }
    main { padding-top: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ------------------------------------------------------------ helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => (n == null || n === '' ? '' : Number(n).toLocaleString('en-AU'));
const fmtL = (n) => (n == null ? '' : fmtN(Math.round(n)) + ' L');
const fmtML = (n) => (n >= 1e6 ? (n / 1e6).toLocaleString('en-AU', { maximumFractionDigits: 2 }) + ' ML' : fmtL(n));
const plural = (n, one, many) => `${fmtN(n)} ${n === 1 ? one : many || one + 's'}`;
const pct = (litres, cap) => (cap ? Math.round((litres / cap) * 100) : 0);
const zone = () => (state.settings && state.settings.timezone) || 'Australia/Brisbane';
function fmtWhen(ms) {
  return new Intl.DateTimeFormat('en-AU', { timeZone: zone(), weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
}
function ago(ms) {
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hours = Math.round(mins / 60);
  if (hours < 48) return `${hours} h ago`;
  return `${Math.round(hours / 24)} days ago`;
}
// The current time in the company's time zone, as a datetime-local value.
function nowLocal() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: zone(), hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
const canDip = () => state.me && (state.me.role === 'admin' || state.me.role === 'dispatcher');
const icon = {
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  logo: '<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 7c3.6 4.6 6 8.1 6 11.1A6 6 0 0 1 10 18.1C10 15.1 12.4 11.6 16 7Z" fill="var(--accent-ink)"/></svg>',
};

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

async function api(path, { method = 'GET', body } = {}) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch('/api' + path, opts);
  } catch {
    throw new Error('Can’t reach the server. Check your connection and try again.');
  }
  let data = null;
  try { data = await res.json(); } catch { /* empty */ }
  if (res.status === 401 && path !== '/login' && state.me) {
    state.me = null;
    render();
  }
  if (!res.ok) {
    const err = new Error((data && data.error) || 'Something went wrong.');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* -------------------------------------------------------------- state */
const state = { me: null, needsSetup: false, cache: {}, settings: null };
const isAdmin = () => state.me && state.me.role === 'admin';

async function load(name, force) {
  if (force || !state.cache[name]) state.cache[name] = await api('/' + name);
  return state.cache[name];
}
function invalidate(...names) { for (const n of names) delete state.cache[n]; }
async function loadSettings(force) {
  if (force || !state.settings) state.settings = await api('/settings');
  return state.settings;
}

/* ---------------------------------------------------------- field defs */
const COMBOS = ['Any', 'Rigid', 'Semi', 'B-double', 'Road train'];
const CLASSES = ['Rigid', 'Semi', 'B-double', 'Road train'];
const FORMS = {

/* ------------------------------------------------------------ weights */
// The parts of a combination that carry fuel, and their weight fields (tonnes).
const UNIT_NAMES = ['Truck', 'Trailer 1', 'Trailer 2'];
const WEIGHT_PARTS = [['gvm_t', 'tare_t'], ['trailer1_gvm_t', 'trailer1_tare_t'], ['trailer2_gvm_t', 'trailer2_tare_t']];
const DEFAULT_DENSITY = 0.85;
const fmtTonnes = (kg) => (kg / 1000).toLocaleString('en-AU', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' t';
const unitsOf = (truck) => (truck.compartment_units || []).length === truck.compartments.length ? truck.compartment_units : truck.compartments.map(() => 0);

// Fuel weight a truck may carry, in kg: per part (GVM less tare) and for the whole
// combination (GCM less every tare), less the company's margin. Infinity where not set.
// The server runs the same check when a run is confirmed.
function weightLimits(truck, unitsInUse, marginKg = 0) {
  const parts = WEIGHT_PARTS.map(([gvm, tare]) =>
    truck[gvm] != null && truck[tare] != null ? (truck[gvm] - truck[tare]) * 1000 - marginKg : Infinity);
  let total = Infinity;
  let missingTare = false;
  if (truck.gcm_t != null) {
    const fitted = WEIGHT_PARTS.filter(([gvm], i) => i === 0 || unitsInUse.has(i) || truck[gvm] != null);
    if (fitted.every(([, tare]) => truck[tare] != null)) {
      total = truck.gcm_t * 1000 - fitted.reduce((a, [, tare]) => a + truck[tare] * 1000, 0) - marginKg;
    } else missingTare = true;
  }
  return { parts, total, missingTare, any: parts.some(Number.isFinite) || Number.isFinite(total) };
}
const truckLimits = (truck) => weightLimits(truck, new Set(unitsOf(truck)), (state.settings && state.settings.mass_margin_kg) || 0);

function weightsEditor(t) {
  const dis = isAdmin() ? '' : ' disabled';
  const inp = (k, label, ph = '') => `<input type="number" inputmode="decimal" step="any" min="0" data-w="${k}" value="${esc(t[k])}" placeholder="${ph}" aria-label="${esc(label)}"${dis}>`;
  const rows = WEIGHT_PARTS.map(([gvm, tare], u) => `<tr><td>${UNIT_NAMES[u]}</td><td>${inp(gvm, UNIT_NAMES[u] + ' GVM in tonnes')}</td>
    <td>${inp(tare, UNIT_NAMES[u] + ' tare in tonnes')}</td><td class="n num" data-carry="${u}"></td></tr>`).join('');
  return `<div class="section" style="margin-top:18px">
    <div class="head" style="margin-bottom:4px"><h2>Weights</h2></div>
    <p class="muted" style="font-size:13px;margin:0 0 10px">In tonnes, from the registration papers. Put a trailer’s ATM in its GVM. “Can carry” is the fuel each part can take: its GVM less its tare, and for the whole combination the GCM less all the tares. Leave a part blank if it isn’t fitted.</p>
    <table class="summary weights"><thead><tr><th></th><th>GVM</th><th>Tare</th><th class="n">Can carry</th></tr></thead><tbody>${rows}
      <tr><td>Whole combination</td><td>${inp('gcm_t', 'GCM in tonnes', 'GCM')}</td><td class="muted" style="font-size:12px">All tares</td><td class="n num" data-carry="total"></td></tr>
    </tbody></table></div>`;
}
function readWeights(root) {
  const out = {};
  for (const el of $$('[data-w]', root)) out[el.dataset.w] = el.value === '' ? null : Number(el.value);
  return out;
}
function wireWeights(form) {
  const update = () => {
    const t = readWeights(form);
    const units = new Set($$('.comp-line select', form).map((x) => Number(x.value)));
    const lim = weightLimits(t, units, (state.settings && state.settings.mass_margin_kg) || 0);
    const show = (kg) => (!Number.isFinite(kg) ? '—' : kg <= 0 ? 'Check tare' : fmtTonnes(kg));
    lim.parts.forEach((kg, u) => { $(`[data-carry="${u}"]`, form).textContent = show(kg); });
    $('[data-carry="total"]', form).textContent = lim.missingTare ? 'Needs every tare' : show(lim.total);
  };
  form.addEventListener('input', update);
  form.addEventListener('change', update);
  update();
}

/* ----------------------------------------------------------- dialogs */
function fieldHtml(f, value, lists) {
  const id = 'f_' + f.k;
  const req = f.required ? ' required' : '';
  const dis = isAdmin() ? '' : ' disabled';
  let input;
  if (f.type === 'bool') {
    const on = value == null ? f.def : value;
    return `<div class="field${f.full ? ' full' : ''}"><label class="check"><input type="checkbox" id="${id}" name="${f.k}"${on ? ' checked' : ''}${dis}> ${esc(f.label)}</label></div>`;
  }
  if (f.type === 'select') {
    input = `<select id="${id}" name="${f.k}"${dis}><option value="">${esc(f.blank || 'Choose…')}</option>${f.options
      .filter((o) => o !== f.blank)
      .map((o) => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`)
      .join('')}</select>`;
  } else if (f.type === 'ref') {
    const items = lists[f.ref] || [];
    input = `<select id="${id}" name="${f.k}"${req}${dis}><option value="">Choose…</option>${items
      .map((it) => `<option value="${it.id}"${it.id === value ? ' selected' : ''}>${esc(f.refLabel ? f.refLabel(it) : it.name)}</option>`)
      .join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${f.k}" rows="3"${dis}>${esc(value)}</textarea>`;
  } else {
    const type = f.type || 'text';
    const step = f.step !== undefined ? ` step="${f.step}"` : '';
    const mode = type === 'number' ? ` inputmode="${f.step === 1 ? 'numeric' : 'decimal'}"` : '';
    input = `<input type="${type}" id="${id}" name="${f.k}" value="${esc(value)}"${step}${mode}${req}${dis}>`;
    if (f.suffix) input = `<div class="suffix">${input}<span>${esc(f.suffix)}</span></div>`;
  }
  return `<div class="field${f.full ? ' full' : ''}"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

function readFields(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.k];
    if (!el) continue;
    if (f.type === 'bool') out[f.k] = el.checked;
    else if (f.type === 'number' || f.type === 'ref') out[f.k] = el.value === '' ? null : Number(el.value);
    else out[f.k] = el.value.trim() === '' ? null : el.value.trim();
  }
  return out;
}

function openDialog({ title, sub, body, onSave, onDelete, saveLabel = 'Save', deleteLabel = 'Delete', readOnly, anyRole }) {
  const dlg = $('#dlg');
  const canEdit = (isAdmin() || (anyRole && canDip())) && !readOnly;
  dlg.innerHTML = `
    <form method="dialog" novalidate>
      <div class="dlg-head"><h2>${esc(title)}</h2>${sub ? `<div class="muted" style="font-size:13px">${esc(sub)}</div>` : ''}</div>
      <div class="dlg-body">${body}<div class="err" id="dlg-err"></div></div>
      <div class="dlg-foot">
        ${canEdit && onSave ? `<button class="btn primary" value="save" type="submit">${esc(saveLabel)}</button>` : ''}
        <button class="btn" value="cancel" type="button" data-close>${canEdit && onSave ? 'Cancel' : 'Close'}</button>
        <span class="spacer"></span>
        ${canEdit && onDelete ? `<button class="btn danger ghost" type="button" data-delete>${esc(deleteLabel)}</button>` : ''}
      </div>
    </form>`;
  const form = $('form', dlg);
  const errBox = $('#dlg-err', dlg);
  $('[data-close]', dlg).onclick = () => dlg.close();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!onSave) return dlg.close();
    errBox.textContent = '';
    const btn = $('button[value=save]', dlg);
    btn.disabled = true;
    try {
      await onSave(form);
      dlg.close();
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  };
  const del = $('[data-delete]', dlg);
  if (del) {
    del.onclick = async () => {
      if (del.dataset.confirm !== '1') {
        del.dataset.confirm = '1';
        del.textContent = 'Tap again to delete';
        return;
      }
      errBox.textContent = '';
      try {
        await onDelete();
        dlg.close();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };
  }
  dlg.showModal();
  const first = $('input:not([type=checkbox]):not([disabled]), select:not([disabled]), textarea:not([disabled])', dlg);
  if (first && window.matchMedia('(pointer: fine)').matches) first.focus();
  return dlg;
}

async function editEntity(name, row, preset = {}) {
  const fields = FORMS[name];
  const lists = {};
  for (const f of fields) if (f.type === 'ref') lists[f.ref] = await load(f.ref);
  const data = { ...preset, ...(row || {}) };
  const isNew = !row;
  const extra = name === 'trucks' ? weightsEditor(data) + compartmentsEditor(data.compartments || [], data.compartment_units || []) : '';
  const tankNote = name === 'tanks' && state.settings
    ? `<div class="note full" style="grid-column:1/-1">Fills to ${Math.round(state.settings.safe_fill_pct * 100)}% of capacity. The lowest level is worked out from this tank’s sales.</div>` : '';
  openDialog({
    title: isNew ? `Add ${NOUN[name]}` : (data.name || data.code || 'Edit'),
    sub: isNew ? '' : (name === 'tanks' ? data.site_name : ''),
    body: `<div class="grid">${fields.map((f) => fieldHtml(f, data[f.k], lists)).join('')}${tankNote}</div>${extra}`,
    onSave: async (form) => {
      const body = readFields(form, fields);
      if (name === 'trucks') {
        body.compartments = $$('.comp-line input', form).map((i) => (i.value === '' ? null : Number(i.value)));
        body.compartment_units = $$('.comp-line select', form).map((x) => Number(x.value));
        Object.assign(body, readWeights(form));
      }
      const missing = fields.find((f) => f.required && (body[f.k] == null || body[f.k] === ''));
      if (missing) throw new Error(`${missing.label} is required.`);
      if (isNew) await api('/' + name, { method: 'POST', body });
      else await api(`/${name}/${row.id}`, { method: 'PUT', body });
      invalidate(name, 'sites', 'tanks', 'grades');
      toast(isNew ? `${cap(NOUN[name])} added` : 'Saved');
      render();
    },
    onDelete: isNew ? null : async () => {
      await api(`/${name}/${row.id}`, { method: 'DELETE' });
      invalidate(name, 'sites', 'tanks', 'grades');
      toast(`${cap(NOUN[name])} deleted`);
      if (name === 'sites') location.hash = '#/sites';
      render();
    },
    deleteLabel: name === 'sites' ? 'Delete site and its tanks' : 'Delete',
  });
  if (name === 'trucks') { wireCompartments(); wireWeights($('#dlg form')); }
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function compartmentsEditor(list, units) {
  const dis = isAdmin() ? '' : ' disabled';
  const line = (v, i, u) => `<div class="comp-line"><b>C${i + 1}</b><input type="number" inputmode="numeric" step="1" min="1" value="${esc(v)}" aria-label="Compartment ${i + 1} litres"${dis}><span class="muted">L</span>
    <select aria-label="Compartment ${i + 1} is on"${dis}>${UNIT_NAMES.map((n, k) => `<option value="${k}"${k === (u || 0) ? ' selected' : ''}>${n}</option>`).join('')}</select>${isAdmin() ? `<button type="button" class="btn sm ghost" data-rm aria-label="Remove compartment ${i + 1}">Remove</button>` : ''}</div>`;
  return `<div class="section" style="margin-top:18px">
    <div class="head" style="margin-bottom:4px"><h2>Compartments</h2><span class="spacer"></span><span class="muted num" id="comp-total"></span></div>
    <p class="muted" style="font-size:13px;margin:0 0 10px">Set which part each compartment is on, so its fuel counts against the right GVM.<span id="comp-split"></span></p>
    <div class="comp-edit" id="comp-list">${list.map((v, i) => line(v, i, units[i])).join('')}</div>
    ${isAdmin() ? '<button type="button" class="btn sm" id="comp-add" style="margin-top:10px">Add compartment</button>' : ''}
    <template id="comp-tpl">${line('', 0, 0)}</template>
  </div>`;
}
function wireCompartments() {
  const list = $('#comp-list');
  const renumber = () => {
    $$('.comp-line', list).forEach((l, i) => { $('b', l).textContent = 'C' + (i + 1); });
    const total = $$('input', list).reduce((a, i) => a + (Number(i.value) || 0), 0);
    $('#comp-total').textContent = `${plural($$('.comp-line', list).length, 'compartment')} · ${fmtL(total)}`;
    const byUnit = UNIT_NAMES.map(() => 0);
    $$('.comp-line', list).forEach((l) => { byUnit[Number($('select', l).value)] += Number($('input', l).value) || 0; });
    const parts = byUnit.map((l, u) => (l ? `${UNIT_NAMES[u]} ${fmtL(l)}` : '')).filter(Boolean);
    $('#comp-split').textContent = parts.length > 1 ? ` ${parts.join(' · ')}.` : '';
  };
  list.addEventListener('change', renumber);
  list.addEventListener('input', renumber);
  list.addEventListener('click', (e) => { if (e.target.matches('[data-rm]')) { e.target.closest('.comp-line').remove(); renumber(); } });
  const add = $('#comp-add');
  if (add) add.onclick = () => {
    const last = $$('.comp-line select', list).pop();
    list.insertAdjacentHTML('beforeend', $('#comp-tpl').innerHTML);
    if (last) $$('.comp-line select', list).pop().value = last.value;
    renumber();
    $$('input', list).pop().focus();
  };
  renumber();
}

function weightSummary(t) {
  const bits = WEIGHT_PARTS.map(([gvm], u) => (t[gvm] != null ? `${UNIT_NAMES[u]} GVM ${fmtN(t[gvm])} t` : '')).filter(Boolean);
  if (t.gcm_t != null) bits.push(`GCM ${fmtN(t.gcm_t)} t`);
  if (!bits.length) return '<span style="color:var(--warn)">No weight limits set</span>';
  const lim = truckLimits(t);
  const carry = Math.min(lim.total, lim.parts.reduce((a, kg, u) => a + (unitsOf(t).includes(u) ? kg : 0), 0));
  return esc(bits.join(' · ')) + (Number.isFinite(carry) ? ` · carries up to ${fmtTonnes(carry)} of fuel` : '');
}
function compChips(t) {
  const units = unitsOf(t);
  const split = new Set(units).size > 1;
  return t.compartments.map((c, i) => `${split && (i === 0 || units[i] !== units[i - 1]) ? `<span class="comp-unit">${UNIT_NAMES[units[i]]}</span>` : ''}<span class="comp"><b>C${i + 1}</b>${fmtN(c)}</span>`).join('');
}

  return '';

async function saveSettings(form) {
  const body = {};
  for (const [, fields] of SETTINGS) for (const f of fields) {
    const el = form.elements[f.k];
    if (f.type === 'bool') body[f.k] = el.checked;
    else if (f.type === 'select' || f.type === 'text') body[f.k] = el.value;
    else {
      const v = el.value === '' ? null : Number(el.value);
      if (f.pct && (v == null || v < f.min || v > f.max)) throw new Error(`${f.label} must be between ${f.min}% and ${f.max}%.`);
      body[f.k] = v == null ? null : (f.pct ? v / 100 : v);
    }
  }
  state.settings = await api('/settings', { method: 'PUT', body });
}

/* ------------------------------------------------------- xlsx reading */
// A small .xlsx reader: unzips the file in the browser and reads sheet XML.
async function readXlsx(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('That file isn’t a valid .xlsx spreadsheet.');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const entries = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('That spreadsheet looks damaged.');
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const offset = view.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, size, offset };
    p += 46 + nameLen + extraLen + commentLen;
  }
  const readEntry = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.offset + 30 + view.getUint16(e.offset + 26, true) + view.getUint16(e.offset + 28, true);
    const data = bytes.subarray(start, start + e.size);
    if (e.method === 0) return new TextDecoder().decode(data);
    if (e.method !== 8) throw new Error('That spreadsheet uses a compression this app can’t read.');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
  const parse = (text) => new DOMParser().parseFromString(text, 'application/xml');
  const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];

  const strings = [];
  const sst = await readEntry('xl/sharedStrings.xml');
  if (sst) for (const si of tags(parse(sst), 'si')) strings.push(tags(si, 't').map((t) => t.textContent).join(''));

  const wb = parse(await readEntry('xl/workbook.xml'));
  const rels = parse(await readEntry('xl/_rels/workbook.xml.rels'));
  const targets = {};
  for (const r of tags(rels, 'Relationship')) targets[r.getAttribute('Id')] = r.getAttribute('Target');
  const colIndex = (ref) => {
    let n = 0;
    for (const ch of ref.replace(/\d+$/, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  const sheets = {};
  for (const sh of tags(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = targets[rid] || '';
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    const xml = await readEntry(target);
    if (!xml) continue;
    const rows = [];
    for (const row of tags(parse(xml), 'row')) {
      const r = Number(row.getAttribute('r')) - 1;
      const out = [];
      for (const c of tags(row, 'c')) {
        const t = c.getAttribute('t');
        const v = tags(c, 'v')[0];
        let value = null;
        if (t === 's') value = v ? strings[Number(v.textContent)] : null;
        else if (t === 'inlineStr') value = tags(c, 't').map((x) => x.textContent).join('');
        else if (t === 'str') value = v ? v.textContent : null;
        else if (t === 'b') value = v ? v.textContent === '1' : null;
        else if (t === 'e') value = null;
        else value = v ? Number(v.textContent) : null;
        out[colIndex(c.getAttribute('r'))] = value;
      }
      rows[r] = out;
    }
    sheets[sh.getAttribute('name')] = rows;
  }
  return sheets;
}

function toPayload(sheets) {
  const payload = {};
  const found = [];
  for (const [sheetName, spec] of Object.entries(SHEETS)) {
    const rows = sheets[sheetName];
    if (!rows || !rows.length) continue;
    const header = (rows[0] || []).map((h) => String(h == null ? '' : h).trim().toLowerCase());
    const map = header.map((h) => spec.cols[h] || null);
    const out = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every((v) => v == null || v === '')) continue;
      const obj = { _row: i + 1 };
      map.forEach((field, c) => {
        if (!field) return;
        let v = r[c];
        if (v === undefined) v = null;
        if (TIME_FIELDS.has(field) && typeof v === 'number') {
          const mins = Math.round((v % 1) * 1440) % 1440;
          v = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
        }
        if (TEXT_FIELDS.has(field) && typeof v === 'number') v = String(v);
        if (typeof v === 'string') v = v.trim();
        obj[field] = v;
      });
      out.push(obj);
    }
    payload[spec.key] = out;
    found.push([sheetName, out.length]);
  }
  return { payload, found };
}

function wireImport() {
  const drop = $('#drop');
  if (!drop) return;
  const out = $('#import-out');
  const handle = async (file) => {
    if (!file) return;
    out.innerHTML = '<div class="note">Reading the spreadsheet…</div>';
    let parsed;
    try {
      if (!/\.xlsx$/i.test(file.name)) throw new Error('Choose an .xlsx file.');
      parsed = toPayload(await readXlsx(await file.arrayBuffer()));
    } catch (err) {
      out.innerHTML = `<div class="note bad">${esc(err.message)}</div>`;
      return;
    }
    if (!parsed.found.length) {
      out.innerHTML = '<div class="note bad">No Sites, Tanks, Trucks, Compartments or Grades tabs were found in that file.</div>';
      return;
    }
    out.innerHTML = `<div class="card"><table class="summary"><thead><tr><th>${esc(file.name)}</th><th style="text-align:right">Rows</th></tr></thead><tbody>
      ${parsed.found.map(([n, c]) => `<tr><td>${esc(n)}</td><td class="n">${fmtN(c)}</td></tr>`).join('')}</tbody></table>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="do-import">Import these rows</button><button class="btn" id="cancel-import">Cancel</button></div></div>`;
    $('#cancel-import').onclick = () => { out.innerHTML = ''; $('#file').value = ''; };
    $('#do-import').onclick = async (e) => {
      e.target.disabled = true;
      try {
        const res = await api('/import', { method: 'POST', body: parsed.payload });
        invalidate('sites', 'tanks', 'trucks', 'grades');
        const s = res.summary;
        const line = (label, o) => (o ? `<tr><td>${label}</td><td class="n">${fmtN(o.created)}</td><td class="n">${fmtN(o.updated)}</td></tr>` : '');
        out.innerHTML = `<div class="note good" style="margin-bottom:12px">Imported. <a href="#/sites">See your sites</a></div>
          <div class="card"><table class="summary"><thead><tr><th></th><th style="text-align:right">Added</th><th style="text-align:right">Updated</th></tr></thead><tbody>
          ${line('Grades', s.grades)}${line('Sites', s.sites)}${line('Tanks', s.tanks)}${line('Trucks', s.trucks)}
          <tr><td>Compartments</td><td class="n" colspan="2">${plural(s.compartments.compartments, 'compartment')} on ${plural(s.compartments.trucks, 'truck')}</td></tr></tbody></table></div>`;
        toast('Import complete');
      } catch (err) {
        const list = err.data && err.data.errors;
        out.insertAdjacentHTML('afterbegin', `<div class="note bad" style="margin-bottom:12px">${list
          ? `Nothing was imported. Fix these in the spreadsheet and try again:<ul>${list.slice(0, 30).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${list.length > 30 ? `<div>…and ${list.length - 30} more.</div>` : ''}`
          : esc(err.message)}</div>`);
        e.target.disabled = false;
      }
    };
  };
  $('#file').onchange = (e) => handle(e.target.files[0]);
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); });
}

/* --------------------------------------------------------------- dips */
function levelBar(litres, cap, was) {
  const p = pct(litres, cap);
  const w = (x) => Math.min(100, Math.max(0, x));
  return `<div class="level${p > 100 ? ' over' : ''}" aria-hidden="true">${was != null ? `<span class="was" style="width:${w(pct(was, cap))}%"></span>` : ''}<span style="width:${w(p)}%"></span></div>`;
}

// Each tank's estimated level now, from the run-out board: its latest dip, less sales since,
// plus deliveries since. Kept for the Enter dips dialog.
async function tankEstimates() {
  const b = await api('/board').catch(() => null);
  const map = new Map();
  for (const s of (b && b.sites) || []) for (const g of s.groups) for (const t of g.tanks) if (t.est) map.set(t.id, t.est);
  state.tankEst = map;
  return map;
}

function dipState(dip) {
  if (!dip) return 'never';
  return Date.now() - dip.taken_at > state.settings.dip_stale_hours * 3600000 ? 'stale' : 'fresh';
}

function dipLine(tank, dip) {
  if (!tank.active) return '';
  if (!dip) return '<span class="badge warn">No dip yet</span>';
  const stale = dipState(dip) === 'stale';
  return `· ${fmtL(dip.litres)} (${pct(dip.litres, tank.capacity_l)}%) ${ago(dip.taken_at)} ${stale ? '<span class="badge warn">Out of date</span>' : ''}`;
}

async function viewDips() {
  const [sites, tanks, latest, settings, estOf] = await Promise.all([load('sites'), load('tanks'), api('/dips/latest'), loadSettings(), tankEstimates()]);
  const dipOf = new Map(latest.map((d) => [d.tank_id, d]));
  const active = tanks.filter((t) => t.active);
  const counts = { fresh: 0, stale: 0, never: 0 };
  for (const t of active) counts[dipState(dipOf.get(t.id))]++;
  const flash = state.flash;
  state.flash = null;

  const groups = sites.map((s) => {
    const mine = active.filter((t) => t.site_id === s.id);
    if (!mine.length) return '';
    const states = mine.map((t) => dipState(dipOf.get(t.id)));
    const needs = states.some((x) => x !== 'fresh');
    const rows = mine.map((t) => {
      const d = dipOf.get(t.id);
      const st = dipState(d);
      const est = d && estOf.get(t.id);
      const dipped = d ? `<span class="nw">${d.source === 'delivery' ? 'Dipped after delivery' : 'Dipped'} ${fmtL(d.litres)}</span> · <span class="nw">${esc(fmtWhen(d.taken_at))}</span> · <span class="nw">${ago(d.taken_at)}</span>` : '';
      const since = est ? [est.sold ? `${fmtL(est.sold)} sold since` : 'nothing sold since', est.delivered ? `${fmtL(est.delivered)} delivered` : ''].filter(Boolean).join(', ') : '';
      return `<li><button class="row" data-dip-tank="${t.id}">
        <div class="main"><div class="title">${esc(t.name)} <span class="chip">${esc(t.grade_code)}</span></div>
          ${d ? (est ? levelBar(est.level, t.capacity_l, d.litres) : levelBar(d.litres, t.capacity_l)) : ''}</div>
        <div class="side dip-side">${!d ? '<span class="badge warn">No dip yet</span>'
          : est ? `<strong class="num">${fmtL(est.level)}</strong> · ${pct(est.level, t.capacity_l)}% <span class="muted">now</span><div class="dip-was">${dipped}<br>${since}</div>`
          : `<strong class="num">${fmtL(d.litres)}</strong> · ${pct(d.litres, t.capacity_l)}%<div class="dip-was">${dipped}<br>No sales uploaded to estimate from</div>`}${st === 'stale' ? '<span class="badge warn" style="margin-top:4px">Dip out of date</span>' : ''}</div>${icon.chev}</button></li>`;
    }).join('');
    return `<div class="card" data-group="${esc(s.name.toLowerCase())}" data-needs="${needs ? 1 : 0}">
      <div class="group-head"><a href="#/sites/${s.id}">${esc(s.name)}</a><span class="spacer"></span>
        ${canDip() ? `<button class="btn sm" data-dip-enter="${s.id}">Enter dips</button>` : ''}</div>
      <ul class="rows">${rows}</ul></div>`;
  }).join('');

  const inactive = tanks.length - active.length;
  return headHtml('Tank dips', `Each active tank’s level now, worked out from its latest dip less the sales since (plus deliveries from runs marked done), with the dip underneath. A dip older than ${fmtN(settings.dip_stale_hours)} hours is flagged.${inactive ? ` ${plural(inactive, 'inactive tank')} not shown.` : ''}`,
    canDip() ? '<button class="btn" data-dip-upload>Upload</button><button class="btn primary" data-dip-enter="">Enter dips</button>' : '') +
    (flash ? `<div class="note ${flash.kind}" style="margin-bottom:12px">${flash.html}</div>` : '') +
    (active.length ? `<div class="stats"><span><strong>${fmtN(counts.fresh)}</strong> up to date</span><span><strong>${fmtN(counts.stale)}</strong> out of date</span><span><strong>${fmtN(counts.never)}</strong> never dipped</span></div>
      <div class="toolbar"><input type="text" id="dq" placeholder="Search sites" aria-label="Search sites">
        <select id="dneeds" aria-label="Which sites"><option value="">All sites</option><option value="1">Sites needing a dip</option></select></div>
      <div id="dip-groups" style="display:grid;gap:16px">${groups}</div>`
      : `<div class="card">${emptyHtml('No active tanks', 'Add tanks to your sites first.')}</div>`);
}

// ---- dip uploads: a CSV template of every active tank, filled in and uploaded as CSV or .xlsx
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

async function downloadDipTemplate() {
  const tanks = (await load('tanks')).filter((t) => t.active);
  const lines = [['Site', 'Tank', 'Grade', 'Capacity (L)', 'Litres', 'Taken at (dd/mm/yyyy hh:mm)']];
  for (const t of tanks) lines.push([t.site_name, t.name, t.grade_code, t.capacity_l, '', '']);
  const csv = '﻿' + lines.map((l) => l.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `dips-${nowLocal().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// Excel stores date-times as days since 30 Dec 1899, in wall-clock time.
function excelSerialToLocal(n) {
  const d = new Date(Math.round((n - 25569) * 86400) * 1000);
  const two = (x) => String(x).padStart(2, '0');
  return `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}T${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`;
}

// Australian dates: 5/10/2026 6:30, 05/10/2026 18:30, 5/10/26 6:30 pm.
function auDateToLocal(v) {
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})[ T,]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
  if (!m) return s;
  let [, d, mo, y, h, mi, ap] = m;
  y = y.length === 2 ? '20' + y : y;
  h = Number(h);
  if (ap) h = (h % 12) + (ap.toLowerCase() === 'pm' ? 12 : 0);
  const two = (x) => String(x).padStart(2, '0');
  return `${y}-${two(mo)}-${two(d)}T${two(h)}:${mi}`;
}

const DIP_COLS = {
  'site': 'site', 'site name': 'site', 'tank': 'tank', 'tank name': 'tank', 'grade': 'grade',
  'litres': 'litres', 'litres l': 'litres', 'dip': 'litres', 'dip l': 'litres', 'level': 'litres', 'volume': 'litres',
  'taken at': 'taken_at', 'date': 'taken_at', 'date time': 'taken_at', 'date/time': 'taken_at', 'time': 'taken_at', 'dip time': 'taken_at',
};

function dipRowsFromTable(table) {
  const header = (table[0] || []).map((h) => String(h == null ? '' : h).toLowerCase().replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim());
  const map = header.map((h) => DIP_COLS[h] || null);
  if (!map.includes('site') || !map.includes('litres')) throw new Error('The file needs at least a Site column and a Litres column. Start from the template.');
  const rows = [];
  let skipped = 0;
  for (let i = 1; i < table.length; i++) {
    const r = table[i];
    if (!r || r.every((v) => v == null || String(v).trim() === '')) continue;
    const o = { _row: i + 1 };
    map.forEach((f, c) => {
      if (!f) return;
      let v = r[c];
      if (v == null) return;
      if (f === 'taken_at') v = typeof v === 'number' ? excelSerialToLocal(v) : auDateToLocal(v);
      else if (typeof v === 'string') v = v.trim();
      if (v !== '') o[f] = v;
    });
    if (o.litres == null) { skipped++; continue; }
    rows.push(o);
  }
  return { rows, skipped };
}

      } else if (/\.csv$/i.test(file.name) || file.type === 'text/csv') {

      out.innerHTML = `<div class="note good">${plural(parsed.rows.length, 'dip')} across ${plural(siteCount, 'site')} ready to upload.${parsed.skipped ? ` ${plural(parsed.skipped, 'row')} with no litres will be skipped.` : ''}</div>`;

  };
  $('#dlg [data-dip-template]').onclick = () => downloadDipTemplate().catch((err) => toast(err.message));
}

/* ------------------------------------------------- Idealpos PDF reading */
// A small PDF text reader, enough for Idealpos (Crystal Reports) exports: plain or
// Flate-compressed streams, literal or hex strings, positioned text. It returns each
// page's text pieces with their position, merged where one word was drawn in parts.

const PDF_WS = new Set([0, 9, 10, 12, 13, 32]);
const PDF_DELIM = new Set('()<>[]{}/%'.split('').map((c) => c.charCodeAt(0)));

function pdfLexer(str, pos = 0) {
  const n = str.length;
  const skip = () => {
    for (;;) {
      while (pos < n && PDF_WS.has(str.charCodeAt(pos))) pos++;
      if (str[pos] === '%') { while (pos < n && str[pos] !== '\n' && str[pos] !== '\r') pos++; continue; }
      return;
    }
  };
  const readString = () => {
    let depth = 1;
    let out = '';
    pos++;
    while (pos < n && depth > 0) {
      const c = str[pos++];
      if (c === '\\') {
        const e = str[pos++];
        if (e === 'n') out += '\n';
        else if (e === 'r') out += '\r';
        else if (e === 't') out += '\t';
        else if (e === 'b') out += '\b';
        else if (e === 'f') out += '\f';
        else if (e === '\r') { if (str[pos] === '\n') pos++; }
        else if (e === '\n') { /* line continuation */ }
        else if (e >= '0' && e <= '7') {
          let oct = e;
          while (oct.length < 3 && str[pos] >= '0' && str[pos] <= '7') oct += str[pos++];
          out += String.fromCharCode(parseInt(oct, 8) & 255);
        } else out += e;
      } else if (c === '(') { depth++; out += c; }
      else if (c === ')') { depth--; if (depth > 0) out += c; }
      else out += c;
    }
    return { t: 'str', v: out };
  };
  const next = () => {
    skip();
    if (pos >= n) return null;
    const c = str[pos];
    if (c === '(') return readString();
    if (c === '<') {
      if (str[pos + 1] === '<') { pos += 2; return { t: 'op', v: '<<' }; }
      const end = str.indexOf('>', pos);
      const hex = str.slice(pos + 1, end).replace(/\s+/g, '');
      pos = end + 1;
      let out = '';
      for (let i = 0; i < hex.length; i += 2) out += String.fromCharCode(parseInt((hex[i] + (hex[i + 1] || '0')), 16));
      return { t: 'str', v: out };
    }
    if (c === '>' && str[pos + 1] === '>') { pos += 2; return { t: 'op', v: '>>' }; }
    if (c === '[' || c === ']' || c === '{' || c === '}') { pos++; return { t: 'op', v: c }; }
    if (c === '/') {
      let j = pos + 1;
      while (j < n && !PDF_WS.has(str.charCodeAt(j)) && !PDF_DELIM.has(str.charCodeAt(j))) j++;
      const v = str.slice(pos + 1, j).replace(/#([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
      pos = j;
      return { t: 'name', v };
    }
    let j = pos;
    while (j < n && !PDF_WS.has(str.charCodeAt(j)) && !PDF_DELIM.has(str.charCodeAt(j))) j++;
    if (j === pos) j++;
    const word = str.slice(pos, j);
    pos = j;
    if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(word)) return { t: 'num', v: parseFloat(word) };
    return { t: 'op', v: word };
  };
  return { next, get pos() { return pos; }, set pos(p) { pos = p; } };
}

// Parses one PDF value (dictionary, array, reference, name, number, string).
function pdfValue(lex, first) {
  const tok = first || lex.next();
  if (!tok) return null;
  if (tok.t === 'op' && tok.v === '<<') {
    const dict = {};
    for (;;) {
      const k = lex.next();
      if (!k || (k.t === 'op' && k.v === '>>')) break;
      dict[k.v] = pdfValue(lex);
    }
    return dict;
  }
  if (tok.t === 'op' && tok.v === '[') {
    const arr = [];
    for (;;) {
      const t = lex.next();
      if (!t || (t.t === 'op' && t.v === ']')) break;
      arr.push(pdfValue(lex, t));
    }
    return arr;
  }
  if (tok.t === 'num' && Number.isInteger(tok.v)) {
    const save = lex.pos;
    const t2 = lex.next();
    if (t2 && t2.t === 'num' && Number.isInteger(t2.v)) {
      const t3 = lex.next();
      if (t3 && t3.t === 'op' && t3.v === 'R') return { ref: tok.v };
    }
    lex.pos = save;
    return tok.v;
  }
  if (tok.t === 'op' && (tok.v === 'true' || tok.v === 'false')) return tok.v === 'true';
  if (tok.t === 'op' && tok.v === 'null') return null;
  return tok.v;
}

async function inflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const latin1 = (bytes) => {
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return s;
};

async function pdfDocument(buffer) {
  const bytes = new Uint8Array(buffer);
  const text = latin1(bytes);
  if (!text.startsWith('%PDF')) throw new Error('That file isn’t a PDF.');
  const offsets = new Map();
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while ((m = re.exec(text))) offsets.set(Number(m[1]), m.index + m[0].length);
  const cache = new Map();
  const object = (num) => {
    if (cache.has(num)) return cache.get(num);
    const at = offsets.get(num);
    if (at === undefined) throw new Error('This PDF is damaged or uses a format the app can’t read.');
    const lex = pdfLexer(text, at);
    const value = pdfValue(lex);
    let result = { value };
    const after = lex.pos;
    const sm = /^\s*stream(\r\n|\n|\r)?/.exec(text.slice(after, after + 20));
    if (sm) {
      const start = after + sm[0].length;
      let len = value && value.Length;
      if (len && typeof len === 'object') len = resolve(len);
      let end = typeof len === 'number' ? start + len : text.indexOf('endstream', start);
      if (text.slice(end, end + 30).indexOf('endstream') < 0) end = text.indexOf('endstream', start);
      result.stream = bytes.subarray(start, end);
    }
    cache.set(num, result);
    return result;
  };
  const resolve = (v) => (v && typeof v === 'object' && 'ref' in v ? object(v.ref).value : v);
  const streamData = async (num) => {
    const o = object(num);
    if (!o.stream) return new Uint8Array();
    let filters = resolve(o.value.Filter);
    filters = filters ? (Array.isArray(filters) ? filters : [filters]) : [];
    let data = o.stream;
    for (const f of filters) {
      if (f !== 'FlateDecode') throw new Error(`This PDF uses ${f} compression, which the app can’t read.`);
      data = await inflate(data);
    }
    return data;
  };
  const trailerAt = text.lastIndexOf('trailer');
  let root;
  if (trailerAt >= 0) root = resolve(pdfValue(pdfLexer(text, trailerAt + 7)).Root);
  else {
    for (const num of offsets.keys()) {
      const v = object(num).value;
      if (v && v.Type === 'Catalog') { root = v; break; }
    }
  }
  if (!root) throw new Error('This PDF is damaged or uses a format the app can’t read.');
  const pages = [];
  const walk = (node, inherited) => {
    node = resolve(node);
    const res = node.Resources ? resolve(node.Resources) : inherited;
    if (node.Type === 'Pages' || node.Kids) for (const k of resolve(node.Kids) || []) walk(k, res);
    else pages.push({ node, resources: res });
  };
  walk(root.Pages, null);
  return { pages, resolve, streamData };
}

// Every piece of text on each page, with x and y (y grows downwards), font size and
// an estimated width from the font's glyph widths.
async function pdfPageText(doc, page) {
  const { resolve, streamData } = doc;
  const fontsRes = page.resources ? resolve(resolve(page.resources).Font) || {} : {};
  const fonts = {};
  for (const [name, ref] of Object.entries(fontsRes)) {
    const f = resolve(ref) || {};
    fonts[name] = { first: resolve(f.FirstChar) || 0, widths: (resolve(f.Widths) || []).map(resolve) };
  }
  let contents = resolve(page.node.Contents);
  const refs = Array.isArray(page.node.Contents) ? page.node.Contents : Array.isArray(contents) ? contents : [page.node.Contents];
  let src = '';
  for (const r of refs) if (r && r.ref) src += latin1(await streamData(r.ref)) + '\n';

  const mul = (a, b) => [
    a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3],
    a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3],
    a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5],
  ];
  let ctm = [1, 0, 0, 1, 0, 0];
  const stack = [];
  let tm = [1, 0, 0, 1, 0, 0];
  let tlm = [1, 0, 0, 1, 0, 0];
  let font = null;
  let size = 0;
  let leading = 0;
  const pieces = [];
  const ops = [];
  const lex = pdfLexer(src);
  const widthOf = (s, kern) => {
    const f = fonts[font] || { first: 0, widths: [] };
    let w = 0;
    for (let i = 0; i < s.length; i++) {
      const g = f.widths[s.charCodeAt(i) - f.first];
      w += typeof g === 'number' && g > 0 ? g : 556;
    }
    return ((w - kern) / 1000) * size;
  };
  const show = (s, kern = 0) => {
    const m = mul(tm, ctm);
    const w = widthOf(s, kern);
    pieces.push({ s, x: m[4], y: m[5], size: Math.abs(size * m[3]) || size, w: w * Math.hypot(m[0], m[1]) });
    tm = mul([1, 0, 0, 1, w, 0], tm);
  };
  for (let tok = lex.next(); tok; tok = lex.next()) {
    if (tok.t !== 'op' || tok.v === '[' || tok.v === '<<') {
      ops.push(tok.t === 'op' ? pdfValue(lex, tok) : tok.v);
      continue;
    }
    const a = ops.splice(0);
    switch (tok.v) {
      case 'q': stack.push(ctm); break;
      case 'Q': ctm = stack.pop() || [1, 0, 0, 1, 0, 0]; break;
      case 'cm': ctm = mul(a.slice(0, 6), ctm); break;
      case 'BT': tm = tlm = [1, 0, 0, 1, 0, 0]; break;
      case 'Tf': font = a[0]; size = a[1]; break;
      case 'TL': leading = a[0]; break;
      case 'Tm': tm = tlm = a.slice(0, 6); break;
      case 'Td': tm = tlm = mul([1, 0, 0, 1, a[0], a[1]], tlm); break;
      case 'TD': leading = -a[1]; tm = tlm = mul([1, 0, 0, 1, a[0], a[1]], tlm); break;
      case 'T*': tm = tlm = mul([1, 0, 0, 1, 0, -leading], tlm); break;
      case 'Tj': if (typeof a[0] === 'string') show(a[0]); break;
      case "'": tm = tlm = mul([1, 0, 0, 1, 0, -leading], tlm); if (typeof a[0] === 'string') show(a[0]); break;
      case '"': tm = tlm = mul([1, 0, 0, 1, 0, -leading], tlm); if (typeof a[2] === 'string') show(a[2]); break;
      case 'TJ': {
        let s = '';
        let kern = 0;
        for (const part of a[0] || []) {
          if (typeof part === 'string') s += part;
          else if (typeof part === 'number') kern += part;
        }
        show(s, kern);
        break;
      }
      default: break;
    }
  }
  // Device space has y growing upwards; flip so rows sort top to bottom.
  for (const p of pieces) p.y = -p.y;
  // Join pieces of one word drawn separately (like "1" "1" "/07/2026").
  pieces.sort((p, q) => (Math.abs(p.y - q.y) > 1 ? p.y - q.y : p.x - q.x));
  const merged = [];
  for (const p of pieces) {
    const last = merged[merged.length - 1];
    if (last && Math.abs(last.y - p.y) <= 1 && p.x - (last.x + last.w) < Math.max(0.6, p.size * 0.12) && p.x >= last.x) {
      last.s += p.s;
      last.w = p.x + p.w - last.x;
    } else merged.push({ ...p });
  }
  for (const p of merged) p.s = p.s.replace(/\s+/g, ' ').trim();
  return merged.filter((p) => p.s !== '');
}

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const isoDay = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const addDays = (iso, n) => {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};

// Reads an Idealpos "Stock Item Sales Trend Report" (daily) into litres per item per day,
// and checks every figure against the report's own row and column totals.
async function readIdealposTrend(buffer) {
  const doc = await pdfDocument(buffer);
  if (!doc.pages.length) throw new Error('This PDF has no pages.');
  const pages = [];
  for (const p of doc.pages) pages.push(await pdfPageText(doc, p));
  const all = pages.flat();
  const find = (re) => { for (const p of all) { const m = p.s.match(re); if (m) return m; } return null; };
  if (!find(/Sales Trend Report/i)) throw new Error('This isn’t an Idealpos Stock Item Sales Trend Report.');
  const range = find(/(\d{1,2}) ([A-Za-z]{3}) (\d{4}) [\d:]+ to (\d{1,2}) ([A-Za-z]{3}) (\d{4})/);
  const scope = find(/Loc ([^\s,]+) to ([^\s,]+).*List: (\w+)/i);
  if (!range || !scope) throw new Error('Couldn’t find the report’s date range and location.');
  if (scope[1] !== scope[2]) throw new Error(`This report covers locations ${scope[1]} to ${scope[2]}. Run it for one location at a time.`);
  if (scope[3].toLowerCase() !== 'daily') throw new Error(`This report is listed by ${scope[3].toLowerCase()}. Run it with List set to Daily.`);
  const start = isoDay(+range[3], MONTHS[range[2].toLowerCase()], +range[1]);
  const end = isoDay(+range[6], MONTHS[range[5].toLowerCase()], +range[4]);

  const DATE = /^(\d{2})\/(\d{2})\/(\d{4})$/;
  // Figures, including negatives written as -1.50, 1.50- or (1.50).
  const NUM = /^\(?-?[\d,]*\.?\d+-?\)?$/;
  const valueOf = (s) => {
    const n = Number(s.replace(/[(),\-\s]/g, ''));
    return /^\(.*\)$|^-|-$/.test(s) ? -n : n;
  };

  // Item labels ("99902 E10") and the Total row's label are on the first page.
  const first = pages[0];
  const items = first
    .filter((p) => /^\d{3,} \S/.test(p.s) && !DATE.test(p.s) && p.x < 200)
    .sort((a, b) => a.y - b.y)
    .map((p) => {
      const [, code, name] = p.s.match(/^(\d+) (.+)$/);
      return { code, name, y: p.y, days: {} };
    });
  if (!items.length) throw new Error('Couldn’t find any stock items in this report.');
  const totalLabel = first.find((p) => p.s === 'Total' && p.x < 200 && p.y > items[items.length - 1].y);
  if (!totalLabel) throw new Error('Couldn’t find the report’s Total row.');
  // Rows: each item, then the Total row. Figures sit on the same line as their label.
  const rowYs = [...items.map((it) => it.y), totalLabel.y];
  const rowName = (i) => (i < items.length ? `${items[i].code} ${items[i].name}` : 'the Total row');
  const rowOf = (p) => {
    let best = -1;
    let gap = 4;
    rowYs.forEach((y, i) => { if (Math.abs(p.y - y) < gap) { gap = Math.abs(p.y - y); best = i; } });
    return best;
  };

  const dayTotals = {};
  let itemTotals = null;
  let lastDay = '';
  for (const pg of pages) {
    const heads = pg.filter((p) => (DATE.test(p.s) || p.s === 'Total') && p.y < items[0].y - 2);
    const dateHeads = heads.filter((p) => DATE.test(p.s)).sort((a, b) => a.x - b.x);
    if (!dateHeads.length) continue;
    const totalHead = heads.find((p) => p.s === 'Total' && p.x > dateHeads[dateHeads.length - 1].x);
    // Columns, by their right-hand edge: figures are right-aligned under their heading.
    const cols = dateHeads.map((h) => {
      const [, d, mo, y] = h.s.match(DATE);
      const iso = isoDay(+y, +mo, +d);
      if (iso <= lastDay || iso < start || iso > end) throw new Error('The report’s dates aren’t in order, so nothing was read from it.');
      lastDay = iso;
      return { day: iso, label: h.s, right: h.x + h.w };
    });
    if (totalHead) cols.push({ day: null, label: 'Total', right: totalHead.x + totalHead.w });
    const spacing = cols.length > 1 ? Math.min(...cols.slice(1).map((c, k) => c.right - cols[k].right)) : 46;
    // Each figure goes in the cell under its column and on its row's line. A cell left
    // blank counts as nothing sold; the totals checks below catch anything that isn't.
    const grid = rowYs.map(() => cols.map(() => []));
    for (const p of pg) {
      if (p.y <= dateHeads[0].y + 2 || !NUM.test(p.s)) continue;
      let col = -1;
      let near = spacing / 2;
      cols.forEach((c, j) => { const d = Math.abs(p.x + p.w - c.right); if (d < near) { near = d; col = j; } });
      if (col < 0) continue;
      const row = rowOf(p);
      if (row < 0) throw new Error(`There’s a figure (${p.s}) under ${cols[col].label} that isn’t on any item’s line, so nothing was read from this report.`);
      grid[row][col].push(p);
    }
    grid.forEach((cells, i) => cells.forEach((list, j) => {
      const text = list.sort((a, b) => a.x - b.x).map((p) => p.s).join('');
      const value = list.length ? valueOf(text) : 0;
      if (!Number.isFinite(value)) throw new Error(`Couldn’t read “${text}” for ${rowName(i)} under ${cols[j].label}, so nothing was read from this report.`);
      const c = cols[j];
      if (c.day) {
        if (i < items.length) items[i].days[c.day] = value;
        else dayTotals[c.day] = value;
      } else {
        itemTotals = itemTotals || [];
        itemTotals[i] = value;
      }
    }));
  }

  // Check against the report's own totals. Days the report leaves out (no figures
  // reached Idealpos) are listed as missing, not treated as zero sales.
  const days = Object.keys(dayTotals).sort();
  if (!days.length) throw new Error('No daily figures were found in this report.');
  const missing = [];
  for (let d = start; d <= end; d = addDays(d, 1)) if (!(d in dayTotals)) missing.push(d);
  const close = (a, b) => Math.abs(a - b) <= 0.02 + Math.abs(b) * 1e-9;
  for (const d of days) {
    const sum = items.reduce((a, it) => a + (it.days[d] || 0), 0);
    if (!close(Math.round(sum * 100) / 100, dayTotals[d])) throw new Error(`The figures for ${d} don’t add up to the report’s total, so nothing was taken from it.`);
  }
  if (!itemTotals) throw new Error('Couldn’t find the report’s Total column.');
  items.forEach((it, i) => {
    const sum = days.reduce((a, d) => a + it.days[d], 0);
    if (!close(Math.round(sum * 100) / 100, itemTotals[i])) throw new Error(`${it.name}’s figures don’t add up to its total, so nothing was taken from this report.`);
  });
  // When it was printed ("Printed 06/10/2026 08:12:01"): figures for that day run up to then.
  const stamp = find(/Printed (\d{2})\/(\d{2})\/(\d{4}),? (\d{1,2}):(\d{2})(?::(\d{2}))?/i);
  const printed = stamp ? `${isoDay(+stamp[3], +stamp[2], +stamp[1])}T${stamp[4].padStart(2, '0')}:${stamp[5]}:${stamp[6] || '00'}` : null;
  return { location: scope[1], start, end, printed, missing, items: items.map(({ code, name, days: d }) => ({ code, name, days: d })) };
}

/* ----------------------------------------- EMC ezi-manager fuel sales */
// Reads an EMC ezi-manager "Fuel Sales Report" or "Fuel Daily Sales Report" exported to Excel: one or more sites, each
// a list of rows (date sold, tank number, grade description, litres sold). Returns one
// report per site, in the same shape as an Idealpos report. Within a site, a grade with
// no row on a day the site traded counts as no sales that day; days with no rows at all
// for the site are listed as missing.
const EMC_MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function emcDay(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) return excelSerialToLocal(v).slice(0, 10);
  const m = String(v == null ? '' : v).trim().match(/^(?:[A-Za-z]+ )?(\d{1,2})[ -]([A-Za-z]{3})[a-z]*[ -](\d{4})$/);
  if (!m || !EMC_MONTHS[m[2].toLowerCase()]) return null;
  return isoDay(+m[3], EMC_MONTHS[m[2].toLowerCase()], +m[1]);
}

function readEmcFuelSales(sheets) {
  const clean = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  for (const rows of Object.values(sheets)) {
    if (!rows || !rows.some((r) => r && r.some((c) => /^Fuel (Daily )?Sales Report$/i.test(clean(c))))) continue;
    // Column positions come from the header row.
    const headRow = rows.find((r) => r && r.some((c) => clean(c).toLowerCase() === 'date sold'));
    if (!headRow) throw new Error('Couldn’t find the Date Sold column in this Fuel Sales Report.');
    const col = (name) => headRow.findIndex((c) => clean(c).toLowerCase() === name);
    const cDate = col('date sold');
    const cTank = col('tank number');
    const cGrade = col('grade description');
    const cLitres = col('litres sold');
    if ([cDate, cGrade, cLitres].some((c) => c < 0)) throw new Error('This Fuel Sales Report is missing the Grade Description or Litres Sold column.');
    let range = null;
    for (const r of rows) {
      const hit = r && r.map(clean).find((c) => /\d{4} to [A-Za-z]+ \d/.test(c));
      if (hit) {
        const m = hit.match(/(\d{1,2} [A-Za-z]{3} \d{4}) to (?:[A-Za-z]+ )?(\d{1,2} [A-Za-z]{3} \d{4})/);
        if (m) range = { start: emcDay(m[1]), end: emcDay(m[2]) };
        break;
      }
    }
    const sites = new Map();
    let site = null;
    const errors = [];
    rows.forEach((r, i) => {
      if (!r) return;
      const filled = r.map((c, j) => [j, c]).filter(([, c]) => clean(c) !== '');
      if (!filled.length) return;
      const day = emcDay(r[cDate]);
      if (day) {
        if (!site) { errors.push(`Row ${i + 1} comes before any site name.`); return; }
        const grade = clean(r[cGrade]);
        const litres = typeof r[cLitres] === 'number' ? r[cLitres] : Number(clean(r[cLitres]).replace(/,/g, ''));
        if (!grade || !Number.isFinite(litres)) { errors.push(`Row ${i + 1} has no grade or litres.`); return; }
        const tank = cTank >= 0 ? clean(r[cTank]) : '';
        const s = sites.get(site);
        s.days.add(day);
        if (!s.items.has(grade)) s.items.set(grade, { days: {}, tanks: new Set(), seen: new Set(), tankDays: {} });
        const it = s.items.get(grade);
        const key = `${day}|${tank}`;
        if (it.seen.has(key)) { errors.push(`Row ${i + 1} repeats ${grade}, tank ${tank} on ${day}.`); return; }
        it.seen.add(key);
        it.days[day] = (it.days[day] || 0) + litres;
        if (tank) {
          it.tanks.add(tank);
          (it.tankDays[tank] = it.tankDays[tank] || []).push(day);
        }
        return;
      }
      // A site heading is a row with only a name in the first column.
      const text = clean(r[filled[0][0]]);
      if (filled.length === 1 && filled[0][0] === cDate && !/ezi-manager|fuel (daily )?sales report|page \d/i.test(text)) {
        site = text;
        if (!sites.has(site)) sites.set(site, { days: new Set(), items: new Map() });
      }
    });
    if (errors.length) throw new Error(`This Fuel Sales Report couldn’t be read: ${errors.slice(0, 3).join(' ')}`);
    if (!sites.size) throw new Error('No sites were found in this Fuel Sales Report.');
    const reports = [];
    for (const [name, s] of sites) {
      const days = [...s.days].sort();
      const start = range && range.start ? range.start : days[0];
      const end = range && range.end ? range.end : days[days.length - 1];
      const missing = [];
      for (let d = start; d <= end; d = addDays(d, 1)) if (!s.days.has(d)) missing.push(d);
      const items = [...s.items].map(([grade, it]) => {
        const full = {};
        for (const d of days) full[d] = Math.round((it.days[d] || 0) * 1000) / 1000;
        return { code: grade, name: grade, days: full, tankDays: it.tankDays, tanks: [...it.tanks].sort((a, b) => a.localeCompare(b, undefined, { numeric: true })) };
      });
      reports.push({ location: name.slice(0, 40), start, end, missing, items, source: 'EMC' });
    }
    return reports;
  }
  return null;
}

const STATUS = {
  overdue: ['bad', 'Overdue'],
  today: ['bad', 'Within 24 h'],
  soon: ['warn', 'Within 48 h'],
  ok: ['ok', 'OK'],
  unknown: ['off', 'Can’t forecast yet'],
};

function rel(ms) {
  const mins = Math.round((ms - Date.now()) / 60000);
  const a = Math.abs(mins);
  const txt = a < 60 ? `${a} min` : a < 48 * 60 ? `${Math.round(a / 60)} h` : `${Math.round(a / 1440)} days`;
  return mins >= 0 ? `in ${txt}` : `${txt} ago`;
}

function dayRanges(list) {
  const days = [...list].sort();
  const out = [];
  const short = (iso) => new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', day: 'numeric', month: 'short' }).format(new Date(iso + 'T00:00:00Z'));
  for (let i = 0; i < days.length; i++) {
    let j = i;
    while (j + 1 < days.length && addDays(days[j], 1) === days[j + 1]) j++;
    out.push(i === j ? short(days[i]) : `${short(days[i])} – ${short(days[j])}`);
    i = j;
  }
  return out.join(', ');
}

function fmtDayShort(iso) {
  return new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(iso + 'T00:00:00Z'));
}
