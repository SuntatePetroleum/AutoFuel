name = "autofuel"
main = "index.js"
compatibility_date = "2025-09-01"

# Create a D1 database in the Cloudflare dashboard (Storage & databases > D1),
# then paste its database ID below. The app creates its own tables on first use.
[[d1_databases]]
binding = "DB"
database_name = "fuel-scheduler"
database_id = "19b7c211-65f5-4dc1-8cde-c61c78e8458e"

# Lets src/index.js import the app's single HTML page as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Drivers' paperwork (photos and PDFs). Create an R2 bucket called autofuel-paperwork in
# the Cloudflare dashboard (R2 Object Storage) before deploying with these lines.
# Without them, paperwork is kept in the database instead.
[[r2_buckets]]
binding = "PAPERWORK"
bucket_name = "autofuel-paperwork"
